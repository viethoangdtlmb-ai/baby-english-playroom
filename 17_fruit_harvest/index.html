<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>Fruit Harvest - Vườn Quả Kỳ Diệu & Rung Cây Thu Hoạch</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Fredoka One', 'Nunito', cursive, sans-serif;
      background: radial-gradient(circle at 50% 30%, #B3E5FC 0%, #E1F5FE 50%, #C8E6C9 85%, #81C784 100%);
      touch-action: manipulation;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    /* Ambient Sun Rays & Floating Clouds */
    .bg-sun {
      position: absolute;
      top: 0px;
      right: 0px;
      width: 140px;
      height: 140px;
      background: radial-gradient(circle, #FFF176 0%, #FFD54F 60%, transparent 80%);
      border-radius: 50%;
      pointer-events: none;
      filter: blur(4px);
      z-index: 1;
      animation: sunGlow 6s infinite ease-in-out alternate;
    }
    @keyframes sunGlow {
      0% { transform: scale(0.95); opacity: 0.8; }
      100% { transform: scale(1.1); opacity: 1; }
    }

    .bg-cloud {
      position: absolute;
      background: rgba(255, 255, 255, 0.75);
      border-radius: 50px;
      pointer-events: none;
      z-index: 1;
      filter: blur(1px);
      animation: floatCloud 25s linear infinite;
    }
    @keyframes floatCloud {
      0% { transform: translateX(-150px); }
      100% { transform: translateX(110vw); }
    }

    /* Rainbow Arc in Top Sky */
    .rainbow-arc-banner {
      position: absolute;
      top: 65px;
      left: 35px;
      background: linear-gradient(135deg, #FF1744 0%, #FF9100 25%, #FFEA00 50%, #00E676 75%, #2979FF 100%);
      border: 3px solid white;
      border-radius: 30px;
      padding: 6px 16px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 1.05rem;
      font-weight: 800;
      color: white;
      box-shadow: 0 6px 16px rgba(0,0,0,0.15);
      cursor: pointer;
      z-index: 35;
      animation: rainbowBob 3s infinite ease-in-out alternate;
    }
    @keyframes rainbowBob {
      0% { transform: translateY(0) rotate(-3deg); }
      100% { transform: translateY(-6px) rotate(3deg); }
    }
    .rainbow-arc-banner:active {
      transform: scale(0.92);
    }

    /* -------------------------------------------------------------
       TOP HUD: Menu + Title Badge + 3 Harvest Stars
       ------------------------------------------------------------- */
    .hud {
      width: 100%;
      max-width: 980px;
      margin: 0 auto;
      padding: 10px 18px 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 40;
      gap: 12px;
    }
    .btn-back {
      background: linear-gradient(135deg, #FF6F00 0%, #E65100 100%);
      color: #FFF;
      border: 3.5px solid #FFF;
      border-radius: 50px;
      padding: 9px 20px;
      font-size: 1.15rem;
      font-weight: 800;
      text-decoration: none;
      box-shadow: 0 6px 16px rgba(230, 81, 0, 0.35);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .btn-back:active {
      transform: scale(0.92);
    }

    .harvest-title-badge {
      background: rgba(255, 255, 255, 0.95);
      border: 3.5px solid #66BB6A;
      border-radius: 40px;
      padding: 6px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 6px 18px rgba(76, 175, 80, 0.25);
    }
    .harvest-title-badge h2 {
      font-size: 1.35rem;
      color: #2E7D32;
      letter-spacing: 0.5px;
    }

    /* 3 Harvest Stars Progress */
    .hud-stars-box {
      background: rgba(255, 255, 255, 0.9);
      border: 3.5px solid #FFD54F;
      border-radius: 36px;
      padding: 6px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.08);
    }
    .hud-star {
      font-size: 1.7rem;
      filter: grayscale(1) opacity(0.35);
      transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275), filter 0.35s;
    }
    .hud-star.earned {
      filter: grayscale(0) opacity(1) drop-shadow(0 2px 8px rgba(255, 179, 0, 0.7));
      animation: starPop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes starPop {
      0% { transform: scale(0.5); }
      70% { transform: scale(1.35); }
      100% { transform: scale(1); }
    }

    /* -------------------------------------------------------------
       MAIN ORCHARD ARENA (Giant Shaking Tree + Basket & Animal)
       ------------------------------------------------------------- */
    .orchard-arena {
      flex: 1;
      width: 100%;
      max-width: 980px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      position: relative;
      padding: 4px 16px 12px;
      z-index: 10;
    }

    /* Target Fruit Prompt Pill */
    .target-prompt-pill {
      background: rgba(255, 255, 255, 0.95);
      border: 3.5px solid #FF9800;
      border-radius: 30px;
      padding: 6px 22px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.25rem;
      font-weight: 800;
      color: #E65100;
      box-shadow: 0 6px 16px rgba(255, 152, 0, 0.25);
      animation: bobPrompt 2.5s infinite ease-in-out alternate;
      cursor: pointer;
    }
    @keyframes bobPrompt {
      0% { transform: translateY(0); }
      100% { transform: translateY(-5px); }
    }

    /* -------------------------------------------------------------
       GIANT CARTOON FRUIT TREE (Multi-touch Shakeable)
       ------------------------------------------------------------- */
    .tree-stage {
      position: relative;
      width: 380px;
      height: 300px;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      margin-top: 6px;
    }

    /* Tree Crown (Fluffy Layered Canopy) */
    .tree-canopy {
      position: relative;
      width: 340px;
      height: 230px;
      background: radial-gradient(circle at 45% 35%, #81C784 0%, #4CAF50 50%, #2E7D32 100%);
      border-radius: 50% 50% 46% 46% / 60% 60% 40% 40%;
      border: 7px solid #1B5E20;
      box-shadow: 0 16px 36px rgba(27, 94, 32, 0.3), inset 0 12px 24px rgba(255, 255, 255, 0.35);
      z-index: 10;
      transform-origin: bottom center;
      transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .tree-canopy.wobble {
      animation: canopyWobble 0.6s cubic-bezier(0.36, 0.07, 0.19, 0.97);
    }
    @keyframes canopyWobble {
      0%, 100% { transform: rotate(0) scale(1); }
      20% { transform: rotate(-8deg) scale(1.06); }
      40% { transform: rotate(7deg) scale(1.05); }
      60% { transform: rotate(-5deg) scale(1.03); }
      80% { transform: rotate(3deg) scale(1.01); }
    }

    /* Cloud Puffs on Canopy to make it fluffy 3D */
    .canopy-puff-1 {
      position: absolute;
      top: -15px;
      left: 30px;
      width: 130px;
      height: 90px;
      background: #81C784;
      border-radius: 50%;
      border-top: 6px solid #1B5E20;
      border-left: 6px solid #1B5E20;
      pointer-events: none;
    }
    .canopy-puff-2 {
      position: absolute;
      top: -20px;
      right: 35px;
      width: 140px;
      height: 95px;
      background: #81C784;
      border-radius: 50%;
      border-top: 6px solid #1B5E20;
      border-right: 6px solid #1B5E20;
      pointer-events: none;
    }

    /* Sturdy Brown Tree Trunk */
    .tree-trunk {
      position: absolute;
      bottom: -15px;
      width: 72px;
      height: 105px;
      background: linear-gradient(90deg, #8D6E63 0%, #6D4C41 50%, #4E342E 100%);
      border: 5px solid #3E2723;
      border-radius: 12px 12px 18px 18px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.25);
      z-index: 5;
    }

    /* Woodpecker Friend on Trunk */
    .woodpecker-friend {
      position: absolute;
      bottom: 25px;
      left: -28px;
      font-size: 2.8rem;
      cursor: pointer;
      z-index: 25;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.2));
      animation: woodpeckerIdle 2.5s infinite ease-in-out alternate;
    }
    @keyframes woodpeckerIdle {
      0% { transform: rotate(-4deg); }
      100% { transform: rotate(4deg); }
    }
    .woodpecker-friend.pecking {
      animation: woodpeckerPeck 0.4s ease-in-out 3;
    }
    @keyframes woodpeckerPeck {
      0%, 100% { transform: rotate(-5deg); }
      50% { transform: rotate(20deg) translateX(8px); }
    }

    /* Hanging Fruits on Branches */
    .fruit-item {
      position: absolute;
      font-size: 3.8rem;
      cursor: pointer;
      filter: drop-shadow(0 6px 12px rgba(0,0,0,0.25));
      z-index: 20;
      animation: fruitSway 2.4s infinite ease-in-out alternate;
      transform-origin: top center;
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .fruit-item img.toddler-3d-word-icon {
      width: 68px !important;
      height: 68px !important;
      object-fit: contain;
      pointer-events: none;
    }
    .fruit-item:hover, .fruit-item:active {
      transform: scale(1.25);
    }
    @keyframes fruitSway {
      0% { transform: rotate(-9deg); }
      100% { transform: rotate(9deg); }
    }

    /* Falling Fruit Physics Trajectory Animation */
    .fruit-item.falling {
      pointer-events: none;
      animation: fruitDropPhysics 0.65s cubic-bezier(0.5, 0, 0.75, 0) forwards;
    }
    @keyframes fruitDropPhysics {
      0% { transform: translateY(0) scale(1.1) rotate(0); }
      50% { transform: translateY(120px) scale(1) rotate(45deg); }
      85% { transform: translateY(220px) scale(0.95) rotate(90deg); opacity: 1; }
      100% { transform: translateY(270px) scale(0.8) rotate(120deg); opacity: 0; }
    }

    /* Leaf Falling Particles */
    .falling-leaf {
      position: absolute;
      font-size: 1.6rem;
      pointer-events: none;
      z-index: 15;
      animation: leafFlutter 1.2s ease-in forwards;
    }
    @keyframes leafFlutter {
      0% { transform: translate(0, 0) rotate(0); opacity: 1; }
      50% { transform: translate(-20px, 80px) rotate(90deg); opacity: 0.9; }
      100% { transform: translate(30px, 180px) rotate(180deg); opacity: 0; }
    }

    /* Rainbow Shower Falling Fruit Drops */
    .rainbow-fruit-drop {
      position: fixed;
      font-size: 2.6rem;
      pointer-events: none;
      z-index: 50;
      animation: rainbowRain 1.4s ease-in forwards;
    }
    @keyframes rainbowRain {
      0% { transform: translateY(-50px) rotate(0); opacity: 1; }
      100% { transform: translateY(105vh) rotate(360deg); opacity: 0; }
    }

    /* -------------------------------------------------------------
       BOTTOM SECTION: 3D WICKER BASKET + HUNGRY CARTOON ANIMAL
       ------------------------------------------------------------- */
    .harvest-ground {
      width: 100%;
      display: flex;
      justify-content: space-around;
      align-items: flex-end;
      position: relative;
      z-index: 25;
      padding-bottom: 6px;
    }

    /* 3D Wicker Fruit Basket (3 Clearly Defined Slots) */
    .basket-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .basket-counter-tag {
      background: #FFFFFF;
      border: 3px solid #FFB300;
      border-radius: 20px;
      padding: 4px 16px;
      font-size: 1.15rem;
      font-weight: 800;
      color: #E65100;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .basket-wicker {
      position: relative;
      width: 240px;
      height: 90px;
      background: linear-gradient(180deg, #D7CCC8 0%, #BCAAA4 40%, #8D6E63 100%);
      border: 5px solid #5D4037;
      border-radius: 16px 16px 42px 42px;
      box-shadow: 0 12px 24px rgba(93, 64, 55, 0.35), inset 0 6px 12px rgba(255, 255, 255, 0.4);
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 0 12px;
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .basket-wicker.bump {
      animation: basketBounce 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes basketBounce {
      0%, 100% { transform: scale(1); }
      40% { transform: scale(1.12) translateY(-8px); }
    }

    /* 3 Circular Slots with Visual Count (1, 2, 3) */
    .basket-slot {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.4);
      border: 3px dashed #795548;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      font-weight: 800;
      color: #5D4037;
      position: relative;
    }
    .basket-slot.filled {
      border: 3px solid #FFA000;
      background: rgba(255, 255, 255, 0.9);
      box-shadow: 0 4px 12px rgba(255, 160, 0, 0.3);
      animation: popSlot 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes popSlot {
      0% { transform: scale(0.3); }
      70% { transform: scale(1.3); }
      100% { transform: scale(1); }
    }
    .slot-fruit-emoji {
      font-size: 2.8rem;
      line-height: 1;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.18));
    }
    .basket-slot img.toddler-3d-word-icon {
      width: 44px !important;
      height: 44px !important;
      object-fit: contain;
      pointer-events: none;
    }

    /* Hungry Cartoon Animal Receiver */
    .animal-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }
    .animal-bubble-thought {
      background: white;
      border: 3px solid #FF9800;
      border-radius: 20px;
      padding: 4px 14px;
      font-size: 1rem;
      font-weight: 800;
      color: #E65100;
      margin-bottom: 6px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .animal-character {
      font-size: 7.4rem;
      line-height: 1;
      filter: drop-shadow(0 12px 24px rgba(0,0,0,0.22));
      cursor: pointer;
      transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .animal-character:active {
      transform: scale(0.92);
    }
    .animal-character.chewing {
      animation: animalChewFeast 0.8s ease-in-out infinite alternate;
    }
    @keyframes animalChewFeast {
      0% { transform: scale(1) rotate(-5deg); }
      50% { transform: scale(1.2) rotate(5deg); }
      100% { transform: scale(1.1) rotate(-3deg); }
    }
    .animal-character.full-tummy {
      animation: bellyInflate 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
    @keyframes bellyInflate {
      0% { transform: scale(1); }
      60% { transform: scale(1.35) translateY(-10px); }
      100% { transform: scale(1.25) translateY(-6px); }
    }

    /* Receiver Identity Badge (Chỉ rõ bạn thú nào đang đón quả) */
    .receiver-name-badge {
      margin-top: 8px;
      background: white;
      border: 3px solid #FFA000;
      border-radius: 24px;
      padding: 4px 14px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.95rem;
      font-weight: 800;
      color: #E65100;
      box-shadow: 0 4px 12px rgba(255, 160, 0, 0.22);
      cursor: pointer;
      z-index: 15;
      transition: transform 0.15s;
    }
    .receiver-name-badge:active {
      transform: scale(0.94);
    }

    /* Canopy Forest Critters: Squirrel, Monkey, Bird, Bee, Butterfly */
    .forest-critter {
      position: absolute;
      z-index: 28;
      filter: drop-shadow(0 8px 16px rgba(0,0,0,0.25));
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Slapstick Comedy Critter (Monkey / Squirrel) */
    .comic-critter-wrap {
      cursor: pointer;
      pointer-events: auto;
      transform-origin: bottom center;
    }
    .comic-critter-body {
      font-size: 4.8rem;
      line-height: 1;
      display: inline-block;
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .comic-dizzy-stars {
      font-size: 1.6rem;
      opacity: 0;
      transform: scale(0.3);
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      margin-bottom: -6px;
      pointer-events: none;
      filter: drop-shadow(0 2px 6px rgba(255, 215, 0, 0.6));
    }
    .comic-critter-bubble {
      opacity: 0;
      transform: scale(0.4) translateY(10px);
      transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      background: white;
      border: 3px solid #FF9800;
      border-radius: 20px;
      padding: 4px 12px;
      font-size: 0.88rem;
      font-weight: 800;
      color: #E65100;
      white-space: nowrap;
      box-shadow: 0 4px 14px rgba(0,0,0,0.2);
      pointer-events: none;
      margin-bottom: 2px;
      position: relative;
    }
    .comic-critter-bubble::after {
      content: '';
      position: absolute;
      bottom: -7px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 7px 6px 0;
      border-style: solid;
      border-color: #FF9800 transparent;
      display: block;
      width: 0;
    }

    /* Phase 1: Slip and wobble on branch */
    .critter-slip {
      animation: critterSlipWobble 0.45s cubic-bezier(0.36, 0.07, 0.19, 0.97) forwards;
    }
    @keyframes critterSlipWobble {
      0% { transform: translateY(0) rotate(0deg) scale(0.8); }
      30% { transform: translateY(-12px) rotate(-26deg) scale(1.15); }
      65% { transform: translateY(-8px) rotate(28deg) scale(1.2); }
      85% { transform: translateY(-4px) rotate(-16deg) scale(1.1); }
      100% { transform: translateY(0) rotate(8deg) scale(1); }
    }

    /* Phase 2: Tumble and double bounce down to the grass */
    .critter-falling-down {
      animation: critterTumbleBounce 0.75s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }
    @keyframes critterTumbleBounce {
      0% { transform: translateY(0) rotate(8deg) scale(1); }
      55% { transform: translateY(215px) rotate(360deg) scale(1.28, 0.72); } /* Land & squash */
      72% { transform: translateY(178px) rotate(390deg) scale(0.88, 1.15); } /* Rebound bounce */
      88% { transform: translateY(215px) rotate(360deg) scale(1.18, 0.82); } /* 2nd squash */
      100% { transform: translateY(210px) rotate(360deg) scale(1, 1); }      /* Settle */
    }

    /* Phase 3: Sitting on grass rubbing bum */
    .critter-rubbing-bum .comic-critter-body {
      animation: critterRubBum 0.8s infinite ease-in-out alternate;
    }
    .critter-rubbing-bum .comic-dizzy-stars {
      opacity: 1;
      transform: scale(1);
      animation: dizzyStarsSpin 1.8s infinite linear;
    }
    .critter-rubbing-bum .comic-critter-bubble {
      opacity: 1;
      transform: scale(1) translateY(0);
    }
    @keyframes critterRubBum {
      0% { transform: rotate(-14deg) scale(1, 0.94) translateX(-4px); }
      50% { transform: rotate(0deg) scale(0.96, 1.04) translateY(-3px); }
      100% { transform: rotate(14deg) scale(1, 0.94) translateX(4px); }
    }
    @keyframes dizzyStarsSpin {
      0% { transform: rotate(0deg) scale(1); }
      50% { transform: rotate(180deg) scale(1.15); }
      100% { transform: rotate(360deg) scale(1); }
    }

    /* Phase 4: Tickle escape when baby taps */
    .critter-tickle-escape {
      animation: critterTickleRocket 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards !important;
      pointer-events: none !important;
    }
    @keyframes critterTickleRocket {
      0% { transform: translateY(210px) scale(1); }
      30% { transform: translateY(140px) scale(1.4) rotate(-20deg); }
      60% { transform: translateY(40px) scale(1.5) rotate(360deg); }
      100% { transform: translateY(-160px) scale(0.2) rotate(720deg); opacity: 0; }
    }

    /* Auto walk away */
    .critter-walk-away {
      animation: critterWalkOff 0.7s ease-in forwards;
      pointer-events: none;
    }
    @keyframes critterWalkOff {
      0% { transform: translateY(210px) scale(1); opacity: 1; }
      50% { transform: translateY(205px) translateX(60px) scale(0.85) rotate(15deg); }
      100% { transform: translateY(215px) translateX(160px) scale(0.2); opacity: 0; }
    }
    .critter-fly-away {
      animation: critterFlyAway 1.4s ease-out forwards;
    }
    @keyframes critterFlyAway {
      0% { transform: translate(0, 0) scale(0.5); opacity: 1; }
      50% { transform: translate(var(--critter-x, 80px), -60px) scale(1.1); }
      100% { transform: translate(calc(var(--critter-x, 80px) * 2), -140px) scale(0.3); opacity: 0; }
    }
    .critter-buzz-bee {
      animation: critterBuzzBee 1.3s ease-in-out forwards;
    }
    @keyframes critterBuzzBee {
      0% { transform: translate(0, 0) scale(0.6); opacity: 1; }
      30% { transform: translate(30px, -25px) scale(1.1) rotate(15deg); }

  <script>
    // -------------------------------------------------------------
    // SAFE WEB AUDIO SYNTHESIZER
    // -------------------------------------------------------------
    const AudioEngine = window.ToddlerAudio || window.AudioEngine || {
      ctx: null,
      init() {
        try {
          if (!this.ctx && (window.AudioContext || window.webkitAudioContext)) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            this.ctx = new AudioCtx();
          }
          if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume();
          }
        } catch (e) {}
      },
      playTone() {},
      playChime() {},
      playWin() {},
      playFanfare() {},
      playPop() {},
      playThud() {},
      speak(t) {},
      speakWord(w) {}
    };

    // 1. Synthesize juicy Plop/Pop when fruit drops into basket
    function playFruitPlopSound() {
      try {
        if (!AudioEngine.ctx) AudioEngine.init();
        const ctx = AudioEngine.ctx;
        if (!ctx) return;

        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(540, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(180, ctx.currentTime + 0.16);

        gain.gain.setValueAtTime(0.35, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.18);

        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.2);
      } catch (e) {}
    }

    // 2. Synthesize crunchy delicious Chomp sound
    function playChompChewSound() {
      try {
        if (!AudioEngine.ctx) AudioEngine.init();
        const ctx = AudioEngine.ctx;
        if (!ctx) return;

        [680, 420].forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.08);
          osc.frequency.exponentialRampToValueAtTime(220, ctx.currentTime + idx * 0.08 + 0.12);

          gain.gain.setValueAtTime(0.32, ctx.currentTime + idx * 0.08);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + idx * 0.08 + 0.14);

          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime + idx * 0.08);
          osc.stop(ctx.currentTime + idx * 0.08 + 0.15);
        });
      } catch (e) {}
    }

    // 3. Synthesize Woodpecker rapid pecking woodblock sound
    function playWoodpeckerPeckSound() {
      try {
        if (!AudioEngine.ctx) AudioEngine.init();
        const ctx = AudioEngine.ctx;
        if (!ctx) return;

        [880, 780, 880, 780].forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.06);

          gain.gain.setValueAtTime(0.28, ctx.currentTime + idx * 0.06);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + idx * 0.06 + 0.05);

          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime + idx * 0.06);
          osc.stop(ctx.currentTime + idx * 0.06 + 0.06);
        });
      } catch (e) {}
    }

    // 4. Synthesize Rainbow fruit shower arpeggio
    function playRainbowShowerSound() {
      try {
        if (!AudioEngine.ctx) AudioEngine.init();
        const ctx = AudioEngine.ctx;
        if (!ctx) return;

        const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51];
        notes.forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.07);

          gain.gain.setValueAtTime(0.22, ctx.currentTime + idx * 0.07);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + idx * 0.07 + 0.28);

          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime + idx * 0.07);
          osc.stop(ctx.currentTime + idx * 0.07 + 0.3);
        });
      } catch (e) {}
    }

    function playRustleLeafSound() {
      if (AudioEngine.playPop) {
        AudioEngine.playPop();
      }
    }

    // -------------------------------------------------------------
    // 52-WEEK VOCABULARY INTEGRATION & ROUND CONFIGURATION
    // -------------------------------------------------------------
    const urlParams = new URLSearchParams(window.location.search);
    const queryWeek = parseInt(urlParams.get('week'));
    const currentWeek = queryWeek || ((window.MissionEngine && MissionEngine.getCurrentWeek) ? MissionEngine.getCurrentWeek() : 1);
    const weekData = (window.ToddlerVocabulary) ? window.ToddlerVocabulary.build80_20Pack(currentWeek) : null;

    // Check week fruits dynamic rotation (16 tropical fruits)
    const allFruits = (window.ToddlerVocabulary && ToddlerVocabulary.CATEGORIES && ToddlerVocabulary.CATEGORIES.food)
      ? ToddlerVocabulary.CATEGORIES.food.filter(f => f.isFruit)
      : [
          { word: 'Apple', emoji: '🍎' },
          { word: 'Banana', emoji: '🍌' },
          { word: 'Orange', emoji: '🍊' },
          { word: 'Strawberry', emoji: '🍓' },
          { word: 'Grape', emoji: '🍇' },
          { word: 'Watermelon', emoji: '🍉' },
          { word: 'Mango', emoji: '🥭' },
          { word: 'Peach', emoji: '🍑' }
        ];

    const weekFruitsList = (weekData && weekData.weekFruits && weekData.weekFruits.length >= 4)
      ? weekData.weekFruits
      : [0, 1, 2, 3].map(i => allFruits[(currentWeek - 1 + i) % allFruits.length]);

    // Animal feeders rotating dynamically across 45 animals
    const animalPool = (window.ToddlerVocabulary && ToddlerVocabulary.CATEGORIES && ToddlerVocabulary.CATEGORIES.animals)
      ? ToddlerVocabulary.CATEGORIES.animals
      : [
          { word: 'Bear', emoji: '🐻' },
          { word: 'Monkey', emoji: '🐵' },
          { word: 'Rabbit', emoji: '🐰' },
          { word: 'Panda', emoji: '🐼' }
        ];

    const harvestRounds = weekFruitsList.map((fObj, idx) => {
      const animIdx = ((currentWeek - 1) * 3 + idx) % animalPool.length;
      const anim = animalPool[animIdx];
      return {
        fruit: fObj.word,
        emoji: fObj.emoji,
        animal: (idx === 0 && weekData && weekData.feedingChar) ? weekData.feedingChar.name : anim.word,
        animalEmoji: (idx === 0 && weekData && weekData.feedingChar) ? weekData.feedingChar.emoji : anim.emoji,
        vnName: fObj.word
      };
    });

    // Game Session State
    let currentRoundIdx = 0;
    let basketHarvestCount = 0;
    const TARGET_HARVEST = 3;
    let isFeasting = false;
    let completedRoundsCount = 0;
    const numberWords = ['One', 'Two', 'Three'];

    // DOM Elements
    const treeCanopy = document.getElementById('tree-canopy');
    const treeStage = document.getElementById('tree-stage');
    const basketWicker = document.getElementById('basket-wicker');
    const basketCounterTag = document.getElementById('basket-counter-tag');
    const animalAvatar = document.getElementById('animal-avatar');
    const animalThought = document.getElementById('animal-thought');
    const thoughtFruitEmoji = document.getElementById('thought-fruit-emoji');
    const promptPill = document.getElementById('prompt-pill');
    const promptText = document.getElementById('prompt-text');
    const promptIcon = document.getElementById('prompt-icon');
    const btnNextRound = document.getElementById('btn-next-round');
    const modalCelebration = document.getElementById('modal-celebration');
    const woodpecker = document.getElementById('woodpecker');
    const farmWagon = document.getElementById('farm-wagon');

    const animalVnMap = {
      'Bear': 'Chú Gấu',
      'Monkey': 'Chú Khỉ',
      'Rabbit': 'Bạn Thỏ',
      'Panda': 'Gấu Trúc',
      'Dog': 'Cún Con',
      'Cat': 'Bé Mèo',
      'Duck': 'Vịt Con',
      'Lion': 'Sư Tử',
      'Elephant': 'Chú Voi',
      'Giraffe': 'Hươu Cao Cổ',
      'Penguin': 'Chim Cánh Cụt',
      'Frog': 'Chú Ếch',
      'Pig': 'Heo Con',
      'Cow': 'Bò Sữa',
      'Sheep': 'Cừu Con',
      'Horse': 'Ngựa Con',
      'Fox': 'Cáo Nhỏ',
      'Tiger': 'Hổ Con',
      'Koala': 'Gấu Koala'
    };
    function getAnimalVnName(en) {
      return animalVnMap[en] || 'Bạn Thú';
    }

    // -------------------------------------------------------------
    // SETUP HARVEST ROUND
    // -------------------------------------------------------------
    function setupRound(idx) {
      currentRoundIdx = idx % harvestRounds.length;
      basketHarvestCount = 0;
      isFeasting = false;

      const round = harvestRounds[currentRoundIdx];

      // Update HUD & Prompts
      promptIcon.innerHTML = (window.ToddlerVocabulary && ToddlerVocabulary.renderWordIcon)
        ? ToddlerVocabulary.renderWordIcon(round.fruit, 36)
        : round.emoji;
      promptText.innerText = `Rung cây hái ${round.fruit}!`;
      thoughtFruitEmoji.innerHTML = (window.ToddlerVocabulary && ToddlerVocabulary.renderWordIcon)
        ? ToddlerVocabulary.renderWordIcon(round.fruit, 44)
        : round.emoji;
      animalAvatar.innerHTML = (window.ToddlerVocabulary && ToddlerVocabulary.renderWordIcon)
        ? ToddlerVocabulary.renderWordIcon(round.animal.toLowerCase(), 110)
        : `<img src="../assets/icons/${round.animal.toLowerCase()}.png" style="width: 110px; height: 110px; object-fit: contain; filter: drop-shadow(0 12px 24px rgba(0,0,0,0.22)); pointer-events: none;" alt="${round.animal}" onerror="this.outerHTML='${round.animalEmoji}'">`;
      animalAvatar.className = 'animal-character';
      animalThought.style.display = 'flex';
      btnNextRound.style.display = 'none';
      farmWagon.classList.remove('arrived');

      // Update Receiver Animal Identity Badge
      const receiverBadge = document.getElementById('receiver-name-badge');
      if (receiverBadge) {
        const vnLabel = getAnimalVnName(round.animal);
        receiverBadge.innerHTML = `${round.animalEmoji} ${round.animal} (${vnLabel}) 🔊`;
      }

      basketCounterTag.innerText = `🧺 Giỏ Quả: 0/${TARGET_HARVEST} ${round.fruit}`;

      // Reset Basket 3 Slots
      for (let i = 0; i < 3; i++) {
        const slot = document.getElementById(`slot-${i}`);
        slot.className = 'basket-slot';
        slot.innerHTML = ['①', '②', '③'][i];
      }

      // Reset Hanging Fruits on Tree (4 quả mục tiêu + 1 quả khác loại để bé tinh mắt phân biệt!)
      const otherFruits = allFruits.filter(f => f.word.toLowerCase() !== round.fruit.toLowerCase());
      const distractorFruit = otherFruits.length > 0 ? otherFruits[currentRoundIdx % otherFruits.length] : { word: 'Banana', emoji: '🍌' };
      const distractorIdx = 4; // Quả số 5 trên cây là quả gây nhiễu vui nhộn

      for (let i = 0; i < 5; i++) {
        const fruit = document.getElementById(`tree-fruit-${i}`);
        const isDistractor = (i === distractorIdx);
        const fItem = isDistractor ? distractorFruit.word : round.fruit;
        const fEmoji = isDistractor ? distractorFruit.emoji : round.emoji;
        const fruitIconHtml = (window.ToddlerVocabulary && ToddlerVocabulary.renderWordIcon)
          ? ToddlerVocabulary.renderWordIcon(fItem, 68)
          : fEmoji;
        fruit.innerHTML = fruitIconHtml;
        fruit.className = 'fruit-item';
        fruit.dataset.isDistractor = isDistractor ? 'true' : 'false';
        fruit.dataset.fruitName = fItem;
        fruit.style.display = 'block';
        fruit.onclick = (e) => {
          e.stopPropagation();
          if (fruit.dataset.isDistractor === 'true') {
            fruit.style.transform = 'scale(1.2) rotate(-15deg)';
            setTimeout(() => { fruit.style.transform = ''; }, 300);
            if (AudioEngine.playPop) AudioEngine.playPop();
            if (AudioEngine.speak) AudioEngine.speak(`${round.fruit} please!`);
            return;
          }
          dropFruitFromTree(fruit);
        };
      }

      // Play Intro Announcement
      setTimeout(() => {
        if (AudioEngine.speak) {
          AudioEngine.speak(`Shake tree! 🌳`);
        }
      }, 400);
    }

    function replayPromptAudio() {
      const round = harvestRounds[currentRoundIdx];
      if (AudioEngine.speak) {
        AudioEngine.speak(`Shake tree! 🌳`);
      }
      triggerCanopyShake();
    }

    let critterCycle = 0;
    function spawnCanopyCritters() {
      critterCycle++;
      const critter = document.createElement('div');
      critter.className = 'forest-critter';
      const type = critterCycle % 2; // Luân phiên để bé thường xuyên thấy chú khỉ / chú sóc hài hước

      if (type === 0) {
        // Tumbling Monkey or Squirrel (Chú Sóc / Chú Khỉ nhào lộn khi rung cây - Hài hước Slapstick 3 Pha)
        const isSquirrel = Math.random() > 0.5;
        const emoji = isSquirrel ? '🐿️' : '🐒';
        
        const wrap = document.createElement('div');
        wrap.className = 'forest-critter comic-critter-wrap critter-slip';
        wrap.style.left = `${75 + Math.random() * 110}px`;
        wrap.style.top = '50px';

        const dizzyStars = document.createElement('div');
        dizzyStars.className = 'comic-dizzy-stars';
        dizzyStars.innerText = '💫💫💫';

        const bubble = document.createElement('div');
        bubble.className = 'comic-critter-bubble';
        bubble.innerText = isSquirrel ? 'Oops! Dizzy squirrel! 🌰' : 'Oops! Silly monkey! 🍌';

        const body = document.createElement('div');
        body.className = 'comic-critter-body';
        body.innerText = emoji;

        wrap.appendChild(dizzyStars);
        wrap.appendChild(bubble);
        wrap.appendChild(body);
        treeCanopy.appendChild(wrap);

        // Pha 1: Trượt chân chới với trên cành cây (0 - 450ms)
        if (window.AudioEngine) {
          if (AudioEngine.playBoing) AudioEngine.playBoing();
          if (AudioEngine.playSqueak) setTimeout(() => AudioEngine.playSqueak(), 180);
        }

        // Pha 2: Rơi nhào lộn và đập mông nảy tưng trên bãi cỏ (450ms - 1200ms)
        setTimeout(() => {
          if (!wrap.isConnected) return;
          wrap.classList.remove('critter-slip');
          wrap.classList.add('critter-falling-down');

          // Tiếng va chạm đập mông và nảy tưng
          setTimeout(() => {
            if (window.AudioEngine) {
              if (AudioEngine.playThud) AudioEngine.playThud(140);
              else if (AudioEngine.playPop) AudioEngine.playPop(260);
            }
          }, 420);

          setTimeout(() => {
            if (window.AudioEngine && AudioEngine.playPop) AudioEngine.playPop(340);
          }, 580);
        }, 450);

        // Pha 3: Ngồi xoa mông, sao hoa mắt xoay tít, bong bóng thoại hài hước (1200ms - 4200ms)
        let hasEscaped = false;
        setTimeout(() => {
          if (!wrap.isConnected || hasEscaped) return;
          wrap.classList.remove('critter-falling-down');
          wrap.style.transform = 'translateY(210px)';
          wrap.classList.add('critter-rubbing-bum');

          if (window.AudioEngine) {
            if (AudioEngine.playChime) AudioEngine.playChime();
            if (AudioEngine.speak) {
              const phrase = isSquirrel ? "Oops! Dizzy squirrel! Hahaha!" : "Oops! Silly monkey! Hahaha!";
              setTimeout(() => AudioEngine.speak(phrase), 200);
            }
          }
        }, 1200);

        // Tương tác chạm: Bé chọc lét / cù chú khỉ chú sóc nhảy vọt lên cười khúc khích
        wrap.onclick = (e) => {
          e.stopPropagation();
          if (hasEscaped) return;
          hasEscaped = true;

          bubble.innerText = 'Wheeee! Hihihi! 💨';
          wrap.classList.remove('critter-rubbing-bum');
          wrap.classList.add('critter-tickle-escape');

          if (window.AudioEngine) {
            if (AudioEngine.playBoing) AudioEngine.playBoing();
            if (AudioEngine.playSqueak) setTimeout(() => AudioEngine.playSqueak(), 120);
            if (AudioEngine.speak) {
              setTimeout(() => AudioEngine.speak("Wheeee! Hahaha!"), 150);
            }
          }

          setTimeout(() => wrap.remove(), 850);
        };

        // Nếu bé không chạm, sau 4.2 giây chú khỉ tự đứng dậy phủi mông chuồn đi
        setTimeout(() => {
          if (!wrap.isConnected || hasEscaped) return;
          hasEscaped = true;
          bubble.style.opacity = '0';
          dizzyStars.style.opacity = '0';
          wrap.classList.remove('critter-rubbing-bum');
          wrap.classList.add('critter-walk-away');
          setTimeout(() => wrap.remove(), 750);
        }, 4200);
      } else if (type === 1) {
        // Buzzing Bumblebee (Chú Ong vù ra)
        critter.innerText = '🐝';
        critter.className = 'forest-critter critter-buzz-bee';
        critter.style.left = `${100 + Math.random() * 80}px`;
        critter.style.top = '80px';
        treeCanopy.appendChild(critter);

        if (window.AudioEngine && AudioEngine.speak && critterCycle % 6 === 1) {
          setTimeout(() => AudioEngine.speak('Buzz buzz! Busy bee!'), 150);
        }
        setTimeout(() => critter.remove(), 1400);
      } else {
        // Fluttering Butterfly or Bird (Chú Bướm hoặc Chú Chim bay lượn qua bầu trời)
        const isButterfly = Math.random() > 0.5;
        critter.innerText = isButterfly ? '🦋' : '🐦';
        critter.className = 'forest-critter critter-fly-away';
        critter.style.left = `${120 + Math.random() * 80}px`;
        critter.style.top = '90px';
        const dir = Math.random() > 0.5 ? 90 : -90;
        critter.style.setProperty('--critter-x', `${dir}px`);
        treeCanopy.appendChild(critter);

        setTimeout(() => critter.remove(), 1500);
      }
    }

    function triggerCanopyShake() {
      treeCanopy.classList.remove('wobble');
      void treeCanopy.offsetWidth;
      treeCanopy.classList.add('wobble');
      playRustleLeafSound();
      spawnFallingLeaves();
      spawnCanopyCritters();
    }

    function spawnFallingLeaves() {
      const emojis = ['🍃', '🍂', '🌿'];
      for (let i = 0; i < 3; i++) {
        const leaf = document.createElement('div');
        leaf.className = 'falling-leaf';
        leaf.innerText = emojis[Math.floor(Math.random() * emojis.length)];
        leaf.style.left = `${60 + Math.random() * 200}px`;
        leaf.style.top = `${40 + Math.random() * 80}px`;
        treeCanopy.appendChild(leaf);
        setTimeout(() => leaf.remove(), 1200);
      }
    }

    // -------------------------------------------------------------
    // WOODPECKER PECTION ASSISTANT
    // -------------------------------------------------------------
    function tapWoodpecker(e) {
      e.stopPropagation();
      playWoodpeckerPeckSound();

      woodpecker.classList.remove('pecking');
      void woodpecker.offsetWidth;
      woodpecker.classList.add('pecking');

      if (AudioEngine.speak) {
        AudioEngine.speak('Woodpecker pecks! Knock knock knock!');
      }

      // Tree responds with huge wobble
      setTimeout(triggerCanopyShake, 150);

      // Drops next available fruit (bỏ qua quả gây nhiễu)
      const available = Array.from(document.querySelectorAll('.fruit-item')).filter(f => !f.classList.contains('falling') && f.style.display !== 'none' && f.dataset.isDistractor !== 'true');
      if (available.length > 0) {
        setTimeout(() => dropFruitFromTree(available[0]), 300);
      }
    }

    // -------------------------------------------------------------
    // RAINBOW FRUIT SHOWER
    // -------------------------------------------------------------
    function triggerRainbowFruitShower() {
      playRainbowShowerSound();

      if (AudioEngine.speak) {
        AudioEngine.speak('Rainbow fruits! 🌈');
      }

      const rainEmojis = ['🍎', '🍊', '🍌', '🍓', '🍇', '🍉', '🥝'];
      for (let i = 0; i < 14; i++) {
        setTimeout(() => {
          const drop = document.createElement('div');
          drop.className = 'rainbow-fruit-drop';
          drop.innerText = rainEmojis[Math.floor(Math.random() * rainEmojis.length)];
          drop.style.left = `${Math.random() * (window.innerWidth - 60)}px`;
          document.body.appendChild(drop);
          setTimeout(() => drop.remove(), 1400);
        }, i * 75);
      }
    }

    // -------------------------------------------------------------
    // DROP FRUIT WITH PHYSICS TRAJECTORY
    // -------------------------------------------------------------
    function handleTreeTap(e) {
      if (isFeasting || basketHarvestCount >= TARGET_HARVEST) return;
      triggerCanopyShake();

      // Find first available target hanging fruit (skip distractor)
      const available = Array.from(document.querySelectorAll('.fruit-item')).filter(f => !f.classList.contains('falling') && f.style.display !== 'none' && f.dataset.isDistractor !== 'true');
      if (available.length > 0) {
        dropFruitFromTree(available[0]);
      }
    }

    let lastDropTime = 0;
    function dropFruitFromTree(fruitElem) {
      if (isFeasting || basketHarvestCount >= TARGET_HARVEST) return;
      if (fruitElem.classList.contains('falling')) return;
      if (Date.now() - lastDropTime < 300) return;
      lastDropTime = Date.now();

      triggerCanopyShake();
      fruitElem.classList.add('falling');

      const round = harvestRounds[currentRoundIdx];
      basketHarvestCount++;

      // Number Voice: One! Two! Three!
      const currentNumber = numberWords[basketHarvestCount - 1] || `${basketHarvestCount}`;
      if (AudioEngine.speak) {
        AudioEngine.speak(`${currentNumber}! ${round.fruit}!`);
      }

      // When fruit hits basket (after 550ms trajectory)
      setTimeout(() => {
        fruitElem.style.display = 'none';
        playFruitPlopSound();

        // Bounce basket
        basketWicker.classList.remove('bump');
        void basketWicker.offsetWidth;
        basketWicker.classList.add('bump');

        // Fill corresponding slot
        const slotIdx = basketHarvestCount - 1;
        const targetSlot = document.getElementById(`slot-${slotIdx}`);
        if (targetSlot) {
          targetSlot.classList.add('filled');
          targetSlot.innerHTML = (window.ToddlerVocabulary && ToddlerVocabulary.renderWordIcon)
            ? ToddlerVocabulary.renderWordIcon(round.fruit, 44)
            : `<span class="slot-fruit-emoji">${round.emoji}</span>`;
        }

        basketCounterTag.innerText = `🧺 Giỏ Quả: ${basketHarvestCount}/${TARGET_HARVEST} ${round.fruit}`;

        // Check if basket is full (3 fruits) - Delay nhẹ để câu đọc Three! [Fruit]! hoàn thành trước khi bạn nhỏ ăn
        if (basketHarvestCount >= TARGET_HARVEST) {
          setTimeout(() => {
            triggerFullBasketFeast(round);
          }, 650);
        }
      }, 550);
    }

    // -------------------------------------------------------------
    // FULL BASKET FEAST (Slapstick Chomping & Farm Wagon Delivery)
    // -------------------------------------------------------------
    function triggerFullBasketFeast(round) {
      isFeasting = true;
      promptText.innerText = `Yummy! ${round.animal} đang ăn ngon lành!`;

      // Tractor Wagon arrives with horn!
      farmWagon.classList.add('arrived');
      playWoodpeckerPeckSound();

      setTimeout(() => {
        // Animal eats fruits
        animalAvatar.classList.add('chewing');
        playChompChewSound();

        if (AudioEngine.speak) {
          AudioEngine.speak(`Chomp chomp! Yummy ${round.fruit}!`);
        }

        setTimeout(() => {
          playChompChewSound();
        }, 600);

        // After eating, animal's belly inflates happily
        setTimeout(() => {
          animalAvatar.classList.remove('chewing');
          animalAvatar.classList.add('full-tummy');

          if (AudioEngine.playFanfare) {
            AudioEngine.playFanfare();
          } else if (AudioEngine.playWin) {
            AudioEngine.playWin();
          }

          if (AudioEngine.speak) {
            AudioEngine.speak(`Full tummy! Yum! 😋`);
          }

          // Launch Fireworks Confetti
          launchHarvestConfetti();

          // Increment Harvest Progress Star
          completedRoundsCount = Math.min(3, completedRoundsCount + 1);
          updateStarsHud();

          // Record Tuesday Mission
          if (window.MissionEngine && MissionEngine.recordAction) {
            MissionEngine.recordAction();
          }

          // Show next button and modal after fanfare and tummy joke finish
          btnNextRound.style.display = 'inline-flex';
          setTimeout(() => {
            document.getElementById('modal-title').innerText = `✨ ${round.animal} Đã No Nê!`;
            document.getElementById('modal-subtitle').innerText = `Bé đã hái đủ 3 giỏ ${round.fruit} cho bạn ${round.animal}! Bụng bạn tròn xoe reo vui!`;

            // Populate Parent Real-World Transfer Tip
            const tipBox = document.getElementById('modal-parent-tip');
            if (tipBox && window.ToddlerVocabulary && ToddlerVocabulary.getRealWorldParentTip) {
              const tipObj = ToddlerVocabulary.getRealWorldParentTip(currentWeek);
              tipBox.innerHTML = `<strong>💡 Mẹo chuyển giao đời thực cho Ba Mẹ:</strong><br>${tipObj.tipText || 'Mẹ hãy cùng bé gọi tên các loại hoa quả có sẵn trong gian bếp hoặc bữa ăn nhẹ của bé nhé!'}`;
              tipBox.style.display = 'block';
            }

            modalCelebration.style.display = 'flex';
          }, 2200);
        }, 1400);

      }, 600);
    }

    function tapAnimalDirectly() {
      if (isFeasting) return;
      playRustleLeafSound();
      animalAvatar.style.transform = 'scale(1.15) rotate(6deg)';
      setTimeout(() => animalAvatar.style.transform = '', 250);
      const round = harvestRounds[currentRoundIdx];
      const vnLabel = getAnimalVnName(round.animal);
      if (AudioEngine.speak) {
        AudioEngine.speak(`${round.fruit}! 🍎 Shake shake!`);
      }
    }

    function advanceToNextRound() {
      modalCelebration.style.display = 'none';
      const tipBox = document.getElementById('modal-parent-tip');
      if (tipBox) tipBox.style.display = 'none';
      setupRound(currentRoundIdx + 1);
    }

    function updateStarsHud() {
      for (let i = 1; i <= 3; i++) {
        const star = document.getElementById(`h-star-${i}`);
        if (star) {
          star.classList.toggle('earned', i <= completedRoundsCount);
        }
      }
    }

    // -------------------------------------------------------------
    // CONFETTI FIREWORKS
    // -------------------------------------------------------------
    function launchHarvestConfetti() {
      const canvas = document.getElementById('confetti-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const colors = ['#FF4081', '#FFD54F', '#40C4FF', '#66BB6A', '#FF9800', '#AB47BC'];
      const particles = [];
      for (let i = 0; i < 90; i++) {
        particles.push({
          x: canvas.width / 2,
          y: canvas.height * 0.45,
          vx: (Math.random() - 0.5) * 16,
          vy: (Math.random() - 0.8) * 16,
          size: Math.random() * 9 + 5,
          color: colors[Math.floor(Math.random() * colors.length)],
          rotation: Math.random() * 360,
          dRotation: (Math.random() - 0.5) * 12,
          alpha: 1
        });
      }

      function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        let alive = false;
        particles.forEach(p => {
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.38;
          p.rotation += p.dRotation;
          p.alpha -= 0.012;

          if (p.alpha > 0) {
            alive = true;
            ctx.save();
            ctx.globalAlpha = p.alpha;
            ctx.translate(p.x, p.y);
            ctx.rotate((p.rotation * Math.PI) / 180);
            ctx.fillStyle = p.color;
            ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
            ctx.restore();
          }
        });
        if (alive) {
          requestAnimationFrame(render);
        } else {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
      }
      render();
    }

    // -------------------------------------------------------------
    // INITIALIZATION & TUESDAY MISSION SYNC
    // -------------------------------------------------------------
    window.addEventListener('DOMContentLoaded', () => {
      // Initialize Tuesday Mission
      if (window.MissionEngine && MissionEngine.initGameMission) {
        MissionEngine.initGameMission('mission_day_2', '.hud');
      }

      window.addEventListener('pointerdown', () => {
        if (window.AudioEngine) {
          AudioEngine.init();
          AudioEngine.startBGM('caring');
        }
      }, { once: true });

      setupRound(0);
    });
  </script>
