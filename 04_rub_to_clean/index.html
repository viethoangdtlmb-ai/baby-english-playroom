<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>Bubble Bath & Clean Up - Tắm Rửa Sạch Sẽ (Chuẩn 52 Tuần)</title>
  <link rel="stylesheet" href="../shared/styles.css">
  <script src="../shared/vocabulary.js"></script>
  <script src="../shared/audio.js"></script>
  <script src="../shared/missions.js"></script>

  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Comic Sans MS', 'Fredoka One', 'Nunito', cursive, sans-serif;
      background: radial-gradient(circle at 50% 30%, #E0F7FA 0%, #B2DFDB 60%, #80CBC4 100%);
      touch-action: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 16px;
    }

    /* Floating Translucent Background Soap Bubbles */
    .bg-bubble {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.8) 0%, rgba(178, 235, 242, 0.35) 60%, rgba(255, 255, 255, 0.6) 100%);
      border: 1.5px solid rgba(255, 255, 255, 0.7);
      box-shadow: inset 0 0 12px rgba(255, 255, 255, 0.5), 0 4px 10px rgba(0, 0, 0, 0.05);
      pointer-events: none;
      z-index: 1;
      animation: floatUpSlow infinite ease-in-out;
    }
    .bub-1 { width: 50px; height: 50px; left: 8%; bottom: -60px; animation-duration: 9s; }
    .bub-2 { width: 80px; height: 80px; left: 22%; bottom: -90px; animation-duration: 13s; animation-delay: 2s; }
    .bub-3 { width: 65px; height: 65px; right: 14%; bottom: -75px; animation-duration: 11s; animation-delay: 4s; }
    .bub-4 { width: 40px; height: 40px; right: 28%; bottom: -50px; animation-duration: 8s; animation-delay: 1s; }

    @keyframes floatUpSlow {
      0% { transform: translateY(0) scale(0.9); opacity: 0; }
      20% { opacity: 0.8; }
      80% { opacity: 0.8; }
      100% { transform: translateY(calc(-100vh - 100px)) scale(1.15); opacity: 0; }
    }

    /* Top HUD */
    .hud {
      width: 100%;
      max-width: 1000px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 20;
    }
    .btn-back {
      background: #FFF;
      color: #00796B;
      border: 3.5px solid #26A69A;
      border-radius: 50px;
      padding: 10px 24px;
      font-size: 1.2rem;
      font-weight: 800;
      text-decoration: none;
      box-shadow: 0 4px 14px rgba(0, 121, 107, 0.2);
      cursor: pointer;
      transition: transform 0.15s;
    }
    .btn-back:active { transform: scale(0.94); }

    /* Target Animal Pill */
    .target-clean-pill {
      background: white;
      border: 4px solid #00ACC1;
      border-radius: 36px;
      padding: 8px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 6px 18px rgba(0, 172, 193, 0.25);
      cursor: pointer;
      animation: targetGlowPulse 2.5s infinite ease-in-out;
      transition: transform 0.15s;
    }
    .target-clean-pill:active { transform: scale(0.96); }
    @keyframes targetGlowPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }
    .clean-pill-emoji {
      font-size: 2.2rem;
      line-height: 1;
    }
    .clean-pill-name {
      font-size: 1.4rem;
      font-weight: 900;
      color: #00838F;
      letter-spacing: 0.5px;
    }
    .clean-pill-speaker {
      background: #E0F7FA;
      border: 2px solid #80DEEA;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.15rem;
      cursor: pointer;
    }

    /* Giant Bath Stage / Ceramic Tub */
    .wash-stage {
      position: relative;
      width: 340px;
      height: 340px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: white;
      box-shadow: 0 20px 45px rgba(0, 77, 64, 0.22), inset 0 0 24px rgba(128, 203, 196, 0.35);
      border: 12px solid #80DEEA;
      margin: 10px auto;
      z-index: 10;
      touch-action: none;
    }

    /* Ceramic Tub Rim Highlights */
    .wash-stage::before {
      content: '';
      position: absolute;
      top: 6px;
      left: 15%;
      width: 70%;
      height: 24px;
      background: rgba(255, 255, 255, 0.7);
      border-radius: 50%;
      filter: blur(2px);
      pointer-events: none;
    }

    /* Character inside Tub */
    .clean-character {
      width: 250px;
      height: 250px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: absolute;
      z-index: 2;
    }
    .char-emoji {
      font-size: 10rem;
      line-height: 1;
      filter: drop-shadow(0 10px 20px rgba(0,0,0,0.18));
      transition: transform 0.3s;
    }
    .char-emoji.happy-bounce {
      animation: bounceWin 0.65s infinite alternate cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes bounceWin {
      0% { transform: scale(1) translateY(0) rotate(-4deg); }
      100% { transform: scale(1.22) translateY(-22px) rotate(4deg); }
    }

    /* Mud Scratch Canvas */
    #mud-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      z-index: 5;
      cursor: pointer;
      touch-action: none;
      transition: opacity 0.6s ease-out;
    }

    /* Interactive Floating Suds & Bubbles */
    .suds-bubble {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #FFFFFF 0%, #E0F7FA 60%, rgba(128, 222, 234, 0.8) 100%);
      border: 2px solid rgba(255, 255, 255, 0.95);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1), inset 0 0 8px rgba(255, 255, 255, 0.8);
      pointer-events: none;
      z-index: 12;
      animation: bubblePopIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }
    @keyframes bubblePopIn {
      0% { transform: scale(0.2); opacity: 0; }
      100% { transform: scale(1); opacity: 0.95; }
    }

    /* Animated Sponge Tool Cursor */
    .sponge-tool {
      position: absolute;
      width: 60px;
      height: 60px;
      font-size: 3.2rem;
      pointer-events: none;
      z-index: 30;
      display: none;
      transform: translate(-50%, -50%);
      filter: drop-shadow(0 6px 12px rgba(0,0,0,0.25));
      animation: spongeSquish 0.3s infinite alternate ease-in-out;
    }
    @keyframes spongeSquish {
      0% { transform: translate(-50%, -50%) scale(1) rotate(-6deg); }
      100% { transform: translate(-50%, -50%) scale(1.12) rotate(6deg); }
    }

    /* Giant Shower Head Trigger Button */
    .btn-shower-head {
      position: absolute;
      top: -35px;
      right: -25px;
      font-size: 4.4rem;
      background: white;
      border: 5px solid #29B6F6;
      border-radius: 50%;
      width: 95px;
      height: 95px;
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 10px 28px rgba(41, 182, 246, 0.45);
      z-index: 40;
      animation: showerCall 0.9s infinite alternate ease-in-out;
      transition: transform 0.15s;
    }
    .btn-shower-head:active { transform: scale(0.9); }
    @keyframes showerCall {
      0% { transform: scale(1) rotate(-12deg); }
      100% { transform: scale(1.18) rotate(12deg); }
    }
    .shower-label-badge {
      position: absolute;
      bottom: -12px;
      background: #0288D1;
      color: white;
      font-size: 0.85rem;
      font-weight: 900;
      padding: 3px 10px;
      border-radius: 14px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
      white-space: nowrap;
    }

    /* Real Water Spray Streams & Splashes */
    .water-spray-overlay {
      position: absolute;
      inset: -10px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 25;
      display: none;
      overflow: hidden;
    }
    .water-drop {
      position: absolute;
      width: 8px;
      height: 28px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.8) 0%, rgba(41, 182, 246, 0.9) 100%);
      border-radius: 6px;
      animation: waterDropFall 0.45s linear infinite;
    }
    @keyframes waterDropFall {
      0% { transform: translateY(-50px); opacity: 0; }
      30% { opacity: 1; }
      100% { transform: translateY(380px); opacity: 0.7; }
    }

    /* Squeaky Clean Sparkling Diamond FX */
    .sparkle-clean-fx {
      position: absolute;
      font-size: 3.5rem;
      pointer-events: none;
      z-index: 35;
      animation: sparkleBurst 0.9s forwards ease-out;
    }
    @keyframes sparkleBurst {
      0% { opacity: 0; transform: scale(0.3) rotate(0deg); }
      50% { opacity: 1; transform: scale(1.4) rotate(90deg); }
      100% { opacity: 0; transform: scale(1.8) rotate(180deg); }
    }

    /* Idle Ghost Hint Hand */
    .ghost-hand-rub {
      position: absolute;
      font-size: 3.6rem;
      pointer-events: none;
      z-index: 50;
      filter: drop-shadow(0 6px 14px rgba(0,0,0,0.3));
      animation: ghostRubbing 1.6s infinite ease-in-out;
      display: none;
    }
    @keyframes ghostRubbing {
      0% { transform: translate(-30px, -20px) scale(1); }
      50% { transform: translate(30px, 20px) scale(1.1); }
      100% { transform: translate(-30px, -20px) scale(1); }
    }

    /* Bottom Controls & Status Wrapper */
    .bottom-dock {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      z-index: 25;
      width: 100%;
    }
    .bath-tools-tray {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: rgba(255, 255, 255, 0.94);
      padding: 6px 14px;
      border-radius: 30px;
      border: 3px solid #80DEEA;
      box-shadow: 0 6px 18px rgba(0, 151, 167, 0.18);
    }
    .bath-tool-btn {
      width: 62px;
      height: 58px;
      border-radius: 20px;
      border: 2.5px solid #B2EBF2;
      background: #FFF;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      line-height: 1;
      transition: transform 0.15s, border-color 0.15s, background 0.15s;
    }
    .bath-tool-btn.active {
      border: 3.5px solid #00ACC1;
      background: #E0F7FA;
      transform: scale(1.08);
      box-shadow: 0 4px 12px rgba(0, 172, 193, 0.25);
    }
    .bath-tool-lbl {
      font-size: 0.68rem;
      font-weight: 900;
      color: #006064;
      margin-top: 3px;
    }

    /* Bottom Status Pill */
    .status-footer-pill {
      background: white;
      border: 3.5px solid #00ACC1;
      border-radius: 36px;
      padding: 8px 28px;
      font-size: 1.2rem;
      font-weight: 800;
      color: #00838F;
      box-shadow: 0 6px 18px rgba(0, 172, 193, 0.18);
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .clean-progress-badge {
      background: #E0F7FA;
      border: 2px solid #4DD0E1;
      color: #006064;
      border-radius: 20px;
      padding: 2px 10px;
      font-size: 0.98rem;
      font-weight: 900;
    }

    /* -------------------------------------------------------------
       MODAL: SQUEAKY CLEAN CELEBRATION (Chốt qua bài rực rỡ)
       ------------------------------------------------------------- */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(10px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 200;
      padding: 16px;
    }
    .celebration-card {
      background: linear-gradient(135deg, #FFFFFF 0%, #FFFDF7 100%);
      border: 6px solid #4DD0E1;
      border-radius: 44px;
      padding: 30px 26px;
      max-width: 520px;
      width: 100%;
      text-align: center;
      box-shadow: 0 24px 60px rgba(0,0,0,0.35);
      animation: popInModal 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes popInModal {
      0% { transform: scale(0.6); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .modal-trophy-icon {
      font-size: 5.2rem;
      animation: floatTrophy 2s infinite ease-in-out alternate;
    }
    @keyframes floatTrophy {
      0% { transform: translateY(0) rotate(-6deg); }
      100% { transform: translateY(-14px) rotate(6deg); }
    }
    .modal-title {
      font-size: 2rem;
      color: #00838F;
      margin: 10px 0 6px;
    }
    .modal-subtitle {
      font-size: 1.2rem;
      color: #37474F;
      margin-bottom: 14px;
      line-height: 1.4;
      font-weight: 700;
    }
    .parent-tip-box {
      background: #E0F7FA;
      border: 2px dashed #00ACC1;
      border-radius: 20px;
      padding: 10px 14px;
      margin-bottom: 18px;
      font-size: 0.95rem;
      color: #006064;
      line-height: 1.4;
      text-align: left;
    }
    .btn-modal-action {
      background: linear-gradient(135deg, #00ACC1 0%, #00838F 100%);
      color: white;
      border: 4px solid #80DEEA;
      border-radius: 50px;
      padding: 15px 36px;
      font-size: 1.35rem;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 10px 28px rgba(0, 131, 143, 0.4);
      transition: transform 0.15s;
    }
    .btn-modal-action:active {
      transform: scale(0.95);
    }

    /* Mobile Responsive Optimizations */
    @media (max-width: 500px) {
      body, html {
        padding: 8px 6px;
        max-width: 100vw;
        overflow-x: hidden;
      }
      .hud {
        gap: 6px;
      }
      .btn-back {
        padding: 6px 12px;
        font-size: 0.95rem;
      }
      .target-clean-pill {
        padding: 5px 12px;
        gap: 6px;
      }
      .clean-pill-emoji {
        font-size: 1.5rem;
      }
      .clean-pill-name {
        font-size: 1.05rem;
      }
      .clean-pill-speaker {
        width: 30px;
        height: 30px;
        font-size: 0.95rem;
      }
      .wash-stage {
        width: min(285px, calc(100vw - 28px));
        height: min(285px, calc(100vw - 28px));
        border-width: 8px;
        margin: 4px auto;
      }
      .clean-character {
        width: 190px;
        height: 190px;
      }
      .char-emoji {
        font-size: 7.5rem;
      }
      .btn-shower-head {
        top: -15px;
        right: 0px;
        width: 74px;
        height: 74px;
        font-size: 3rem;
      }
      .bath-tool-btn {
        width: 56px;
        height: 52px;
      }
      .status-footer-pill {
        font-size: 1rem;
        padding: 6px 18px;
      }
    }
  </style>
</head>
<body>

  <!-- MODAL: SQUEAKY CLEAN CELEBRATION (Chốt qua bài rực rỡ) -->
  <div class="modal-overlay" id="modal-celebration">
    <div class="celebration-card">
      <div class="modal-trophy-icon" id="modal-icon">✨🛁</div>
      <h2 class="modal-title" id="modal-title">Bạn Nhỏ Đã Sạch Bong!</h2>
      <p class="modal-subtitle" id="modal-subtitle">Bé đã tắm rửa cho bạn nhỏ thơm phức, sạch bong kin kít rồi!</p>
      <div class="parent-tip-box" id="modal-parent-tip">💡 Mẹo cho Bố Mẹ: Khi tắm hoặc rửa tay cho bé, hãy cùng bé nói <em>"Wash, wash! Clean hands!"</em> nhé!</div>

      <button type="button" class="btn-modal-action" id="btn-next-clean" onclick="advanceToNextCleanTarget()">
        <span>🎉 Tắm Cho Bạn Tiếp Theo ➜</span>
      </button>
    </div>
  </div>

  <!-- Floating Background Soap Bubbles -->
  <div class="bg-bubble bub-1"></div>
  <div class="bg-bubble bub-2"></div>
  <div class="bg-bubble bub-3"></div>
  <div class="bg-bubble bub-4"></div>

  <!-- HUD with Target Pill & Shared Mission Tracker -->
  <div class="hud">
    <a href="../index.html" class="btn-back">⬅ Menu</a>

    <!-- Target Character Pill: Chạm để nghe nhắc lại -->
    <div class="target-clean-pill" id="target-clean-pill" title="Chạm để nghe gọi tên">
      <span class="clean-pill-emoji" id="clean-pill-emoji">🐷</span>
      <span class="clean-pill-name" id="clean-pill-name">DIRTY PIG</span>
      <div class="clean-pill-speaker">🔊</div>
    </div>

    <!-- Placeholder for Mission HUD -->
    <div style="width: 80px;"></div>
  </div>

  <!-- Bath Stage with Tub & Canvas (100% Unobstructed Scrubbing Surface) -->
  <div class="wash-stage" id="wash-stage">
    <!-- Character waiting for bath -->
    <div class="clean-character">
      <span class="char-emoji" id="target-emoji">🐷</span>
    </div>

    <!-- Canvas with Rich Mud Texture -->
    <canvas id="mud-canvas" width="340" height="340"></canvas>

    <!-- Water Spray Stream Overlay -->
    <div class="water-spray-overlay" id="water-spray-overlay"></div>

    <!-- Giant Shower Head Button (Appears when soap lather is ready) -->
    <div class="btn-shower-head" id="btn-shower-head" title="Chạm xịt vòi sen!">
      <img src="../assets/icons/bath.png" style="width: 58px; height: 58px; object-fit: contain; pointer-events: none;" alt="🚿" onerror="this.outerHTML='🚿'">
      <div class="shower-label-badge">Xịt Nước!</div>
    </div>

    <!-- Interactive Sponge/Soap/Brush Tool Cursor -->
    <div class="sponge-tool" id="sponge-tool">
      <img src="../assets/icons/sponge.png" style="width: 56px; height: 56px; object-fit: contain;" alt="🧽" onerror="this.outerHTML='🧽'">
    </div>

    <!-- Ghost Hint Hand -->
    <div class="ghost-hand-rub" id="ghost-hand-rub">👆🧽</div>
  </div>

  <!-- Bottom Dock: 3-Tool Bath Tray (Docked outside the tub so it never blocks scrubbing) + Realtime Status Pill -->
  <div class="bottom-dock">
    <div class="bath-tools-tray" id="bath-tools-tray">
      <button type="button" class="bath-tool-btn active" data-tool="sponge" data-emoji="🧽" data-word="Sponge" data-phrase="Sponge! Scrub clean with a sponge!" onclick="selectBathTool(this)">
        <img src="../assets/icons/sponge.png" style="width: 32px; height: 32px; object-fit: contain; pointer-events: none;" alt="🧽">
        <span class="bath-tool-lbl">Sponge</span>
      </button>
      <button type="button" class="bath-tool-btn" data-tool="soap" data-emoji="🧼" data-word="Soap" data-phrase="Soap! Wash with bubbles and soap!" onclick="selectBathTool(this)">
        <img src="../assets/icons/soap.png" style="width: 32px; height: 32px; object-fit: contain; pointer-events: none;" alt="🧼">
        <span class="bath-tool-lbl">Soap</span>
      </button>
      <button type="button" class="bath-tool-btn" data-tool="brush" data-emoji="🪥" data-word="Brush" data-phrase="Brush! Scrub shiny and clean!" onclick="selectBathTool(this)">
        <img src="../assets/icons/brush.png" style="width: 32px; height: 32px; object-fit: contain; pointer-events: none;" alt="🪥">
        <span class="bath-tool-lbl">Brush</span>
      </button>
    </div>

    <div class="status-footer-pill" id="status-footer-pill">
      <span id="status-footer-text">🧽 Chà sạch bùn nào!</span>
      <span class="clean-progress-badge" id="clean-progress-badge">🫧 0%</span>
    </div>
  </div>

  <script>
    // -------------------------------------------------------------
    // DYNAMIC 52-WEEK RUB TO CLEAN SYSTEM (Chuẩn tâm lý trẻ 3 tuổi)
    // -------------------------------------------------------------
    const urlParams = new URLSearchParams(window.location.search);
    const queryWeek = parseInt(urlParams.get('week'), 10);
    const currentWeek = (!isNaN(queryWeek) && queryWeek >= 1 && queryWeek <= 52)
      ? queryWeek
      : ((window.MissionEngine && MissionEngine.getCurrentWeek) ? MissionEngine.getCurrentWeek() : 1);

    const weekData = (window.ToddlerVocabulary) ? window.ToddlerVocabulary.build80_20Pack(currentWeek) : null;

    // Lấy đúng đối tượng tắm của tuần từ ngân hàng 16 đối tượng xoay vòng
    const activeTarget = (weekData && weekData.cleanTarget)
      ? weekData.cleanTarget
      : { id: 'pig', name: 'Dirty Pig', vnTitle: 'Tắm cho bạn Heo lấm bùn', emoji: '🐷', voice: 'Wash Pig! Oink! 🐷' };

    const canvas = document.getElementById('mud-canvas');
    const ctx = canvas.getContext('2d');
    const targetEmoji = document.getElementById('target-emoji');
    const cleanPillEmoji = document.getElementById('clean-pill-emoji');
    const cleanPillName = document.getElementById('clean-pill-name');
    const statusFooterText = document.getElementById('status-footer-text');
    const cleanProgressBadge = document.getElementById('clean-progress-badge');
    const btnShower = document.getElementById('btn-shower-head');
    const waterSpray = document.getElementById('water-spray-overlay');
    const spongeTool = document.getElementById('sponge-tool');
    const ghostHand = document.getElementById('ghost-hand-rub');
    const washStage = document.getElementById('wash-stage');

    let currentToolMode = 'sponge';

    window.selectBathTool = function(btn) {
      if (!btn) return;
      currentToolMode = btn.getAttribute('data-tool') || 'sponge';
      const toolEmoji = btn.getAttribute('data-emoji') || '🧽';
      if (spongeTool) {
        spongeTool.innerHTML = `<img src="../assets/icons/${currentToolMode}.png" style="width: 56px; height: 56px; object-fit: contain;" alt="${toolEmoji}" onerror="this.outerHTML='${toolEmoji}'">`;
      }
      document.querySelectorAll('.bath-tool-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      AudioEngine.init();
      if (AudioEngine.playPop) AudioEngine.playPop();

      if (currentToolMode === 'soap') {
        AudioEngine.speak('Soap! Bubbles! 🧼');
        if (statusFooterText) statusFooterText.innerText = '🧼 Xoa xà bông bọt tuyết bồng bềnh!';
      } else if (currentToolMode === 'brush') {
        AudioEngine.speak('Brush! Scrub scrub! 🪥');
        if (statusFooterText) statusFooterText.innerText = '🪥 Dùng bàn chải cọ sạch vết bùn đất!';
      } else {
        AudioEngine.speak('Sponge! Wipe wipe! 🧽');
        if (statusFooterText) statusFooterText.innerText = '🧽 Dùng bọt biển lau sạch bong kin kít!';
      }
    };

    let isCleaned = false;
    let showerReady = false;
    let isDrawing = false;
    let lastScrubX = null;
    let lastScrubY = null;
    let rubCount = 0;

    // -------------------------------------------------------------
    // VẼ LỚP BÙN TỰ NHIÊN & ĐẦY MÀU SẮC TRẺ THƠ (MUD GENERATOR)
    // -------------------------------------------------------------
    function drawRichMud() {
      ctx.globalCompositeOperation = 'source-over';
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Nền bùn tròn bo theo bồn tắm
      ctx.fillStyle = '#6D4C41';
      ctx.beginPath();
      ctx.arc(170, 170, 160, 0, Math.PI * 2);
      ctx.fill();

      // Các đốm bùn đậm nhạt tự nhiên
      const mudPatches = [
        { x: 110, y: 100, r: 65, col: '#5D4037' },
        { x: 230, y: 110, r: 75, col: '#4E342E' },
        { x: 130, y: 220, r: 85, col: '#5D4037' },
        { x: 240, y: 230, r: 70, col: '#4E342E' },
        { x: 170, y: 160, r: 60, col: '#795548' },
        { x: 90,  y: 170, r: 45, col: '#3E2723' },
        { x: 250, y: 170, r: 50, col: '#3E2723' }
      ];
      mudPatches.forEach(p => {
        ctx.fillStyle = p.col;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
      });

      // Vết chân bùn đất tinh nghịch
      ctx.fillStyle = '#3E2723';
      const pawPrints = [
        { x: 140, y: 130 }, { x: 200, y: 140 }, { x: 170, y: 200 }
      ];
      pawPrints.forEach(pw => {
        ctx.beginPath();
        ctx.arc(pw.x, pw.y, 14, 0, Math.PI * 2);
        ctx.fill();
        for (let a = -0.6; a <= 0.6; a += 0.4) {
          ctx.beginPath();
          ctx.arc(pw.x + Math.sin(a) * 22, pw.y - Math.cos(a) * 22, 5, 0, Math.PI * 2);
          ctx.fill();
        }
      });

      // Hé lộ đôi mắt tinh nghịch của bạn nhỏ để bé nhận diện nhân vật ngay từ đầu
      ctx.globalCompositeOperation = 'destination-out';
      ctx.beginPath();
      ctx.arc(135, 135, 22, 0, Math.PI * 2);
      ctx.arc(205, 135, 22, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalCompositeOperation = 'source-over';
    }

    function getCleanNoun(target) {
      if (!target) return 'Friend';
      const found = (window.ToddlerVocabulary && ToddlerVocabulary.findWordById)
        ? ToddlerVocabulary.findWordById(target.id)
        : null;
      if (found && found.word) return found.word;
      return (target.name || '').replace(/^(Dirty|Muddy|Dusty|Messy|Puddle|Honey|Mud)\s+/i, '');
    }

    // -------------------------------------------------------------
    // KHỞI TẠO MÀN TẮM RỬA (INITIALIZATION)
    // -------------------------------------------------------------
    function initBath(target) {
      isCleaned = false;
      showerReady = false;
      rubCount = 0;
      lastScrubX = null;
      lastScrubY = null;

      // Clear any leftover bubbles
      document.querySelectorAll('.suds-bubble').forEach(b => b.remove());

      canvas.style.opacity = '1';
      canvas.style.pointerEvents = 'auto';
      targetEmoji.classList.remove('happy-bounce');
      btnShower.style.display = 'none';
      waterSpray.style.display = 'none';

      drawRichMud();

      // Cập nhật thông tin nhân vật với icon 3D nổi khối
      if (window.ToddlerVocabulary && ToddlerVocabulary.renderWordIcon) {
        targetEmoji.innerHTML = ToddlerVocabulary.renderWordIcon(target.id || target.name, 195);
        cleanPillEmoji.innerHTML = ToddlerVocabulary.renderWordIcon(target.id || target.name, 36);
      } else {
        targetEmoji.innerText = target.emoji;
        cleanPillEmoji.innerText = target.emoji;
      }
      cleanPillName.innerText = target.name.toUpperCase();
      if (statusFooterText) statusFooterText.innerText = `🧽 Chà sạch bùn cho ${target.name} nào!`;
      if (cleanProgressBadge) cleanProgressBadge.innerText = `🫧 0%`;

      // Giọng nói mở màn Motherese
      setTimeout(() => {
        AudioEngine.speak(target.voice || `Wash the ${target.name}! Rub, rub, rub!`);
        scheduleIdleHint();
      }, 600);
    }

    // -------------------------------------------------------------
    // TẠO BỌT XÀ PHÒNG BỒNG BỀNH (SUDS & BUBBLES GENERATOR)
    // -------------------------------------------------------------
    function spawnSoapSuds(x, y, isSoap = false) {
      const colors = [
        'radial-gradient(circle at 35% 35%, #FFFFFF 0%, #F8BBD0 50%, rgba(240, 98, 146, 0.85) 100%)',
        'radial-gradient(circle at 35% 35%, #FFFFFF 0%, #E1BEE7 50%, rgba(186, 104, 200, 0.85) 100%)',
        'radial-gradient(circle at 35% 35%, #FFFFFF 0%, #B2EBF2 50%, rgba(38, 198, 218, 0.85) 100%)',
        'radial-gradient(circle at 35% 35%, #FFFFFF 0%, #FFF59D 50%, rgba(255, 213, 79, 0.85) 100%)'
      ];
      const count = isSoap ? 4 : 1;
      for (let i = 0; i < count; i++) {
        const bubble = document.createElement('div');
        bubble.className = 'suds-bubble';
        const size = (isSoap ? 36 : 24) + Math.random() * 32;
        const offsetX = isSoap ? (Math.random() * 50 - 25) : 0;
        const offsetY = isSoap ? (Math.random() * 50 - 25) : 0;
        bubble.style.width = size + 'px';
        bubble.style.height = size + 'px';
        bubble.style.left = (x + offsetX - size / 2) + 'px';
        bubble.style.top = (y + offsetY - size / 2) + 'px';
        if (isSoap) {
          bubble.style.background = colors[Math.floor(Math.random() * colors.length)];
          bubble.style.boxShadow = '0 0 10px rgba(255, 255, 255, 0.8), inset 0 0 8px rgba(255, 255, 255, 0.9)';
        }
        washStage.appendChild(bubble);

        setTimeout(() => {
          if (bubble && bubble.parentNode) bubble.remove();
        }, 4500);
      }
    }

    function spawnBrushSparkle(x, y) {
      const sp = document.createElement('div');
      sp.innerText = '✨';
      sp.style.position = 'absolute';
      sp.style.left = (x - 12 + (Math.random() * 30 - 15)) + 'px';
      sp.style.top = (y - 12 + (Math.random() * 30 - 15)) + 'px';
      sp.style.fontSize = (1.2 + Math.random() * 0.8) + 'rem';
      sp.style.pointerEvents = 'none';
      sp.style.zIndex = '35';
      sp.style.transition = 'all 0.4s ease-out';
      washStage.appendChild(sp);
      setTimeout(() => {
        sp.style.transform = 'translateY(-25px) scale(1.4)';
        sp.style.opacity = '0';
        setTimeout(() => sp.remove(), 400);
      }, 20);
    }

    // -------------------------------------------------------------
    // SCRUBBING & LATHERING LOGIC (Phân biệt sâu sắc 3 công cụ)
    // -------------------------------------------------------------
    function scrub(x, y, isTapStart = false) {
      if (isCleaned) return;
      hideGhostHint();
      ctx.globalCompositeOperation = 'destination-out';

      // Khác biệt rõ rệt giữa 3 công cụ:
      // - Sponge: Lau diện rộng cực lớn (82px), siêu nhanh
      // - Soap: Thoa bọt vừa phải (44px) + tạo ngập tràn bọt xà phòng cầu vồng
      // - Brush: Cọ sọc (34px) tạo rãnh cào và văng tia sao lấp lánh
      const radius = currentToolMode === 'sponge' ? 82 : (currentToolMode === 'soap' ? 44 : 34);

      ctx.beginPath();
      if (!isTapStart && lastScrubX !== null && lastScrubY !== null) {
        ctx.lineWidth = radius * 2;
        ctx.lineCap = 'round';
        ctx.moveTo(lastScrubX, lastScrubY);
        ctx.lineTo(x, y);
        ctx.stroke();

        // Với Brush: Cọ thêm 2 đường sọc song song tạo rãnh sợi lông bàn chải
        if (currentToolMode === 'brush') {
          const dx = x - lastScrubX;
          const dy = y - lastScrubY;
          const dist = Math.sqrt(dx * dx + dy * dy) || 1;
          const nx = -dy / dist * 14;
          const ny = dx / dist * 14;
          ctx.lineWidth = 12;
          ctx.beginPath();
          ctx.moveTo(lastScrubX + nx, lastScrubY + ny);
          ctx.lineTo(x + nx, y + ny);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(lastScrubX - nx, lastScrubY - ny);
          ctx.lineTo(x - nx, y - ny);
          ctx.stroke();
        }
      } else {
        ctx.arc(x, y, radius * 1.15, 0, Math.PI * 2);
        ctx.fill();
      }
      lastScrubX = x;
      lastScrubY = y;

      rubCount += isTapStart ? 3 : 1;

      // Hiệu ứng âm thanh & hạt riêng biệt từng công cụ:
      if (currentToolMode === 'soap') {
        // Xà bông: Tạo nhiều bọt xà phòng sủi bọt xèo xèo
        if (isTapStart || rubCount % 2 === 0) {
          spawnSoapSuds(x, y, true);
          if (window.ToddlerAudio) ToddlerAudio.playPop(340 + Math.random() * 160);
        }
      } else if (currentToolMode === 'brush') {
        // Bàn chải: Văng hạt bụi/sao lấp lánh & âm thanh cọ xoẹt xoẹt rột rột
        if (isTapStart || rubCount % 3 === 0) {
          spawnBrushSparkle(x, y);
          if (window.ToddlerAudio) {
            ToddlerAudio.playTone(850 + Math.random() * 300, 'sawtooth', 0.05, 0.15);
          }
        }
      } else {
        // Bọt biển: Tiếng mút xốp éc éc squish, hút bọt
        if (isTapStart || rubCount % 3 === 0) {
          spawnSoapSuds(x, y, false);
          if (window.ToddlerAudio) {
            ToddlerAudio.playTone(420 + Math.random() * 80, 'triangle', 0.08, 0.2);
          }
        }
      }

      // Kiểm tra tiến độ sạch liên tục để cập nhật % trực quan
      if (isTapStart || rubCount % 4 === 0) {
        checkBathProgress();
      }
    }

    function checkBathProgress() {
      const imgData = ctx.getImageData(50, 50, 240, 240).data;
      let transparentCount = 0;
      const totalSamples = imgData.length / 32;
      for (let i = 3; i < imgData.length; i += 32) {
        if (imgData[i] === 0) transparentCount++;
      }

      const ratio = transparentCount / totalSamples;
      // Quy đổi tỷ lệ tẩy sang % hoàn thành giai đoạn chà xà phòng (mốc 0.42 = 100% sẵn sàng xối nước)
      const pct = Math.min(100, Math.round((ratio / 0.42) * 100));
      if (cleanProgressBadge && !isCleaned) {
        cleanProgressBadge.innerText = `🫧 ${pct}%`;
      }

      if (ratio >= 0.42 && !showerReady) {
        showerReady = true;
        btnShower.style.display = 'flex';
        if (statusFooterText) statusFooterText.innerText = `🚿 Chạm vòi sen xịt nước nào!`;
        if (cleanProgressBadge) cleanProgressBadge.innerText = `🚿 100%`;

        if (window.ToddlerAudio) {
          ToddlerAudio.playChime();
          ToddlerAudio.speak('Shower time! 🚿');
        }

        // Tự động nhắc nhở sau 4s nếu bé chưa bấm vòi sen
        scheduleShowerHint();
      }
    }

    // -------------------------------------------------------------
    // SHOWER RINSE ACTION (Xối nước vòi sen cuốn trôi toàn bộ bọt)
    // -------------------------------------------------------------
    btnShower.addEventListener('pointerdown', (e) => {
      e.stopPropagation();
      triggerShowerRinse();
    });

    function triggerShowerRinse() {
      if (isCleaned) return;
      isCleaned = true;
      btnShower.style.display = 'none';
      hideGhostHint();

      // Âm thanh nước xối róc rách & lời khen ngắn gọn (Không gọi trùng Fanfare)
      if (window.ToddlerAudio) {
        ToddlerAudio.playSplash();
        ToddlerAudio.speak('Splash! Wash, wash, wash!');
      }

      // Kích hoạt vòi phun nước rơi xối xả
      waterSpray.innerHTML = '';
      waterSpray.style.display = 'block';
      for (let i = 0; i < 24; i++) {
        const drop = document.createElement('div');
        drop.className = 'water-drop';
        drop.style.left = (15 + Math.random() * 310) + 'px';
        drop.style.animationDelay = (Math.random() * 0.4) + 's';
        waterSpray.appendChild(drop);
      }

      // Xóa sạch canvas và bọt xà phòng
      canvas.style.opacity = '0';
      canvas.style.pointerEvents = 'none';

      document.querySelectorAll('.suds-bubble').forEach(b => {
        b.style.transition = 'all 0.6s ease-out';
        b.style.transform = 'translateY(120px) scale(0.2)';
        b.style.opacity = '0';
        setTimeout(() => b.remove(), 600);
      });

      // Tạo hiệu ứng kim cương lấp lánh thơm tho
      const sparkles = ['✨', '💎', '⭐', '💖', '🌟'];
      for (let i = 0; i < 10; i++) {
        setTimeout(() => {
          const sp = document.createElement('div');
          sp.className = 'sparkle-clean-fx';
          sp.innerText = sparkles[i % sparkles.length];
          sp.style.left = (70 + Math.random() * 200) + 'px';
          sp.style.top = (70 + Math.random() * 200) + 'px';
          washStage.appendChild(sp);
          setTimeout(() => sp.remove(), 900);
        }, i * 160);
      }

      const cleanNoun = getCleanNoun(currentActiveTarget);

      // Kết thúc xối nước sau 1.6s -> Biến hình từ Dirty sang Clean & đọc câu ngữ cảnh!
      setTimeout(() => {
        waterSpray.style.display = 'none';
        targetEmoji.classList.add('happy-bounce');
        cleanPillName.innerText = `CLEAN ${cleanNoun.toUpperCase()} ✨`;
        if (statusFooterText) statusFooterText.innerText = `🎉 Clean ${cleanNoun}! Sạch bong kin kít!`;
        if (cleanProgressBadge) cleanProgressBadge.innerText = `✨ 100%`;

        const contextPhrase = (window.ToddlerVocabulary && ToddlerVocabulary.getWordContextPhrase)
          ? ToddlerVocabulary.getWordContextPhrase(currentActiveTarget.id || cleanNoun)
          : `${cleanNoun}! Clean ${cleanNoun.toLowerCase()}!`;
        if (window.ToddlerAudio) ToddlerAudio.playFanfare();
        AudioEngine.speak(`Clean ${cleanNoun}! ${contextPhrase}`);

        // Ghi nhận hoàn thành nhiệm vụ Day 4
        if (window.MissionEngine && MissionEngine.recordAction) {
          MissionEngine.recordAction();
        }

        // Hiện modal chiến thắng sau 2.1s để bé nghe trọn vẹn câu ngữ cảnh và ngắm nhân vật nhảy múa
        setTimeout(() => {
          const modal = document.getElementById('modal-celebration');
          const modalTitle = document.getElementById('modal-title');
          const modalSubtitle = document.getElementById('modal-subtitle');
          const modalIcon = document.getElementById('modal-icon');
          const tipBox = document.getElementById('modal-parent-tip');
          if (modalTitle) modalTitle.innerText = `Clean ${cleanNoun}! Sạch Bong! ✨`;
          if (modalSubtitle) modalSubtitle.innerText = `${currentActiveTarget.vnTitle || ('Tắm cho ' + cleanNoun)} hoàn tất! Thơm phức sạch bong rồi!`;
          if (modalIcon) {
            modalIcon.innerHTML = (window.ToddlerVocabulary && ToddlerVocabulary.renderWordIcon)
              ? ToddlerVocabulary.renderWordIcon(currentActiveTarget.id || cleanNoun, 88)
              : `${currentActiveTarget.emoji}✨🛁`;
          }
          if (tipBox) {
            tipBox.innerHTML = `💡 <strong>Mẹo cho Bố Mẹ:</strong> Khi rửa tay, tắm mát hoặc rửa hoa quả/đồ chơi cùng bé hôm nay, hãy dạy bé cặp từ đối lập: <em>"${currentActiveTarget.name}"</em> ➜ <em>"Clean ${cleanNoun}! ${contextPhrase}"</em> nhé!`;
          }
          if (modal) modal.style.display = 'flex';
        }, 2100);
      }, 1600);
    }

    // -------------------------------------------------------------
    // DANH SÁCH XOAY VÒNG TRỌN BỘ 16 BẠN NHỎ/ĐỒ VẬT KHI CHƠI TIẾP
    // -------------------------------------------------------------
    const cleanTargetList = (window.ToddlerVocabulary && ToddlerVocabulary.CLEANING_TARGETS && ToddlerVocabulary.CLEANING_TARGETS.length)
      ? ToddlerVocabulary.CLEANING_TARGETS
      : [
          { id: 'pig', name: 'Dirty Pig', vnTitle: 'Tắm cho bạn Heo lấm bùn', emoji: '🐷', voice: 'Wash Pig! Oink! 🐷' },
          { id: 'dog', name: 'Muddy Dog', vnTitle: 'Tắm cho bạn Cún lấm lem', emoji: '🐶', voice: 'Wash Dog! Woof woof! 🐶' },
          { id: 'car', name: 'Dusty Car', vnTitle: 'Rửa xe ô tô dính bụi', emoji: '🚗', voice: 'Clean Car! Vroom vroom! 🚗' },
          { id: 'cat', name: 'Muddy Cat', vnTitle: 'Tắm cho bạn Mèo con', emoji: '🐱', voice: 'Clean Cat! Meow! 🐱' },
          { id: 'duck', name: 'Muddy Duck', vnTitle: 'Tắm cho bạn Vịt con', emoji: '🦆', voice: 'Wash Duck! Quack quack! 🦆' },
          { id: 'bear', name: 'Muddy Bear', vnTitle: 'Tắm cho bạn Gấu nâu', emoji: '🐻', voice: 'Wash Bear! Grrr! 🐻' },
          { id: 'elephant', name: 'Muddy Elephant', vnTitle: 'Tắm cho bạn Voi con', emoji: '🐘', voice: 'Elephant! Splash! 🐘' }
        ];
    let currentTargetIdx = 0;
    let currentActiveTarget = activeTarget;
    const foundIdx = cleanTargetList.findIndex(t => t.id === activeTarget.id);
    if (foundIdx !== -1) currentTargetIdx = foundIdx;

    function advanceToNextCleanTarget() {
      const modal = document.getElementById('modal-celebration');
      if (modal) modal.style.display = 'none';
      currentTargetIdx = (currentTargetIdx + 1) % cleanTargetList.length;
      currentActiveTarget = cleanTargetList[currentTargetIdx];
      initBath(currentActiveTarget);
    }
    window.advanceToNextCleanTarget = advanceToNextCleanTarget;

    // -------------------------------------------------------------
    // IDLE GHOST HINT HAND (Bàn tay chỉ dẫn thông minh)
    // -------------------------------------------------------------
    let idleTimer = null;
    function scheduleIdleHint() {
      hideGhostHint();
      idleTimer = setTimeout(() => {
        if (!showerReady && !isCleaned) {
          showRubHint();
        }
      }, 3800);
    }

    function scheduleShowerHint() {
      hideGhostHint();
      idleTimer = setTimeout(() => {
        if (showerReady && !isCleaned) {
          showShowerHint();
        }
      }, 3800);
    }

    function hideGhostHint() {
      if (idleTimer) clearTimeout(idleTimer);
      ghostHand.style.display = 'none';
    }

    function showRubHint() {
      ghostHand.innerText = '👆🧽';
      ghostHand.style.left = '42%';
      ghostHand.style.top = '40%';
      ghostHand.style.display = 'block';
      AudioEngine.speak(`Wash ${currentActiveTarget.name}! 🧼`);
      scheduleIdleHint();
    }

    function showShowerHint() {
      ghostHand.innerText = '👆🚿';
      ghostHand.style.left = '75%';
      ghostHand.style.top = '10%';
      ghostHand.style.display = 'block';
      AudioEngine.speak('Tap the shower!');
    }

    // -------------------------------------------------------------
    // TOUCH & POINTER HANDLING FOR MUD CANVAS
    // -------------------------------------------------------------
    function getCanvasCoords(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: (clientX - rect.left) * (canvas.width / rect.width),
        y: (clientY - rect.top) * (canvas.height / rect.height),
        stageX: clientX - washStage.getBoundingClientRect().left,
        stageY: clientY - washStage.getBoundingClientRect().top
      };
    }

    canvas.addEventListener('pointerdown', (e) => {
      AudioEngine.init();
      isDrawing = true;
      const c = getCanvasCoords(e);
      spongeTool.style.display = 'block';
      spongeTool.style.left = c.stageX + 'px';
      spongeTool.style.top = c.stageY + 'px';
      scrub(c.x, c.y, true);
    });

    window.addEventListener('pointermove', (e) => {
      if (!isDrawing) return;
      const c = getCanvasCoords(e);
      spongeTool.style.left = c.stageX + 'px';
      spongeTool.style.top = c.stageY + 'px';
      scrub(c.x, c.y, false);
    });

    window.addEventListener('pointerup', () => {
      isDrawing = false;
      lastScrubX = null;
      lastScrubY = null;
      spongeTool.style.display = 'none';
      if (!showerReady && !isCleaned) scheduleIdleHint();
    });

    // Chạm vào Pill trên HUD để nghe lại đúng tên bạn nhỏ hiện tại (currentActiveTarget)
    document.getElementById('target-clean-pill').addEventListener('pointerdown', (e) => {
      e.stopPropagation();
      hideGhostHint();
      const cleanNoun = getCleanNoun(currentActiveTarget);
      if (isCleaned) {
        AudioEngine.speak(`Clean ${cleanNoun}!`);
      } else {
        AudioEngine.speak(`Wash ${currentActiveTarget.name}! 🧼`);
      }
    });

    // -------------------------------------------------------------
    // KHỞI ĐỘNG NHIỆM VỤ DAY 4 (MISSION ENGINE INTEGRATION)
    // -------------------------------------------------------------
    if (window.MissionEngine && MissionEngine.initGameMission) {
      MissionEngine.initGameMission('mission_day_4', '.hud');
    }

    // Nạp đối tượng tắm tuần hiện tại
    initBath(currentActiveTarget);
  </script>
</body>
