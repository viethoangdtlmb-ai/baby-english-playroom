<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>Peek-a-boo Box - Hộp Quà Ú Òa (Chuẩn 52 Tuần)</title>
  <link rel="stylesheet" href="../shared/styles.css">
  <script src="../shared/audio.js"></script>
  <script src="../shared/vocabulary.js"></script>
  <script src="../shared/missions.js"></script>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: var(--font-toddler, 'Nunito', 'Baloo 2', cursive, sans-serif);
      background: radial-gradient(circle at 50% 25%, #E0F7FA 0%, #B2EBF2 55%, #C8E6C9 100%);
      touch-action: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 16px;
    }

    /* Floating Clouds / Sparkling BG Elements */
    .bg-cloud {
      position: absolute;
      background: rgba(255, 255, 255, 0.65);
      border-radius: 50px;
      pointer-events: none;
      z-index: 1;
      filter: blur(1px);
      animation: floatCloud 24s infinite linear;
    }
    .cloud-1 { width: 140px; height: 45px; top: 12%; left: -160px; animation-duration: 28s; }
    .cloud-2 { width: 180px; height: 55px; top: 22%; left: -200px; animation-duration: 34s; animation-delay: 8s; }
    .cloud-3 { width: 120px; height: 40px; top: 8%; left: -140px; animation-duration: 22s; animation-delay: 16s; }

    @keyframes floatCloud {
      0% { transform: translateX(0); }
      100% { transform: translateX(calc(100vw + 350px)); }
    }

    /* Top HUD */
    .hud {
      width: 100%;
      max-width: 1100px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 20;
    }
    .btn-back {
      background: #FFF;
      color: #FF5722;
      border: 3.5px solid #FF5722;
      border-radius: 50px;
      padding: 10px 24px;
      font-size: 1.2rem;
      font-weight: 800;
      text-decoration: none;
      box-shadow: 0 4px 14px rgba(255, 87, 34, 0.25);
      cursor: pointer;
      transition: transform 0.15s;
    }
    .btn-back:active { transform: scale(0.94); }

    /* Target Badge in HUD */
    .peek-target-box {
      background: white;
      border: 4px solid #0288D1;
      border-radius: 36px;
      padding: 8px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 6px 18px rgba(2, 136, 209, 0.25);
      cursor: pointer;
      animation: targetPulse 2.5s infinite ease-in-out;
      transition: transform 0.15s;
    }
    .peek-target-box:active { transform: scale(0.96); }
    @keyframes targetPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }
    .target-lbl {
      font-size: 1.1rem;
      font-weight: 800;
      color: #0277BD;
    }
    .target-emoji {
      font-size: 2.2rem;
      line-height: 1;
      filter: drop-shadow(0 3px 6px rgba(0,0,0,0.15));
    }
    .target-name {
      font-size: 1.5rem;
      font-weight: 900;
      color: #01579B;
      letter-spacing: 0.5px;
    }
    .target-speaker {
      background: #E1F5FE;
      border: 2px solid #81D4FA;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.15rem;
      cursor: pointer;
    }

    /* Arena with 3 Giant Magical Boxes */
    .boxes-arena {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 36px;
      width: 100%;
      max-width: 1050px;
      height: 420px;
      margin: 0 auto;
      padding-bottom: 24px;
      z-index: 10;
    }

    .box-slot {
      position: relative;
      width: 230px;
      height: 380px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      cursor: pointer;
    }

    /* Pop-up surprise inside box */
    .animal-popup {
      position: absolute;
      bottom: 120px;
      width: 220px;
      height: 220px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transform: translateY(90px) scale(0.2);
      opacity: 0;
      transition: transform 0.55s cubic-bezier(0.175, 0.885, 0.32, 1.42), opacity 0.25s;
      z-index: 25;
      pointer-events: none;
    }
    .animal-popup.revealed {
      transform: translateY(-150px) scale(1.35);
      opacity: 1;
    }
    .animal-popup.dancing {
      animation: popupHappyDance 1.2s infinite ease-in-out alternate;
    }
    @keyframes popupHappyDance {
      0% { transform: translateY(-150px) scale(1.35) rotate(-6deg); }
      100% { transform: translateY(-160px) scale(1.4) rotate(6deg); }
    }

    .popup-emoji {
      font-size: 6.8rem;
      line-height: 1;
      filter: drop-shadow(0 12px 20px rgba(0,0,0,0.22));
    }
    .popup-label {
      background: white;
      border: 4px solid #FFA000;
      border-radius: 24px;
      padding: 6px 20px;
      font-size: 1.4rem;
      font-weight: 900;
      color: #E65100;
      box-shadow: 0 6px 16px rgba(0,0,0,0.16);
      margin-top: 10px;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    /* 3D Marshmallow Gift Box */
    .gift-box {
      position: relative;
      width: 210px;
      height: 165px;
      z-index: 10;
      transform-origin: bottom center;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .gift-box:active {
      transform: scale(0.95);
    }
    /* Curiosity Wiggle */
    .gift-box.wobble {
      animation: boxWobble 0.6s ease-in-out;
    }
    @keyframes boxWobble {
      0%, 100% { transform: scale(1) rotate(0deg); }
      20% { transform: scale(1.08) rotate(-7deg); }
      40% { transform: scale(1.08) rotate(7deg); }
      60% { transform: scale(1.05) rotate(-4deg); }
      80% { transform: scale(1.05) rotate(4deg); }
    }

    /* Box Base */
    .box-base {
      position: absolute;
      bottom: 0;
      width: 210px;
      height: 130px;
      border-radius: 26px;
      overflow: hidden;
      border: 4.5px solid rgba(0,0,0,0.15);
      box-shadow: 0 16px 30px rgba(0,0,0,0.18), inset 0 -8px 0 rgba(0,0,0,0.12);
    }
    /* Box 1: Strawberry Cupcake Red with Golden Dots */
    .box-base.red {
      background-color: #D50000;
      background-image: radial-gradient(#FFE082 22%, transparent 24%), linear-gradient(135deg, #FF5252 0%, #D50000 100%);
      background-size: 32px 32px, 100% 100%;
    }
    /* Box 2: Sunshine Honey Orange with White Dots */
    .box-base.orange {
      background-color: #E65100;
      background-image: radial-gradient(rgba(255,255,255,0.7) 22%, transparent 24%), linear-gradient(135deg, #FFA726 0%, #E65100 100%);
      background-size: 32px 32px, 100% 100%;
    }
    /* Box 3: Ocean Blue with Soft Pastel Dots */
    .box-base.blue {
      background-color: #1565C0;
      background-image: radial-gradient(#FFF59D 22%, transparent 24%), linear-gradient(135deg, #42A5F5 0%, #1565C0 100%);
      background-size: 32px 32px, 100% 100%;
    }

    /* Vertical Golden Ribbon */
    .box-ribbon-v {
      position: absolute;
      left: 50%;
      top: 0;
      bottom: 0;
      width: 38px;
      transform: translateX(-50%);
      background: linear-gradient(90deg, #FFD54F 0%, #FFF59D 50%, #FFCA28 100%);
      border-left: 2.5px solid rgba(0,0,0,0.1);
      border-right: 2.5px solid rgba(0,0,0,0.1);
      box-shadow: 0 0 8px rgba(255, 213, 79, 0.4);
    }

    /* Box Lid */
    .box-lid {
      position: absolute;
      top: 14px;
      left: -10px;
      width: 230px;
      height: 44px;
      border-radius: 18px;
      border: 4.5px solid rgba(0,0,0,0.15);
      box-shadow: 0 8px 18px rgba(0,0,0,0.22);
      z-index: 12;
      transform-origin: top left;
      transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.3), opacity 0.3s;
    }
    .box-lid.red {
      background: linear-gradient(135deg, #FF1744 0%, #C51162 100%);
    }
    .box-lid.orange {
      background: linear-gradient(135deg, #FF9800 0%, #EF6C00 100%);
    }
    .box-lid.blue {
      background: linear-gradient(135deg, #2979FF 0%, #0D47A1 100%);
    }

    .box-lid.open {
      transform: translateY(-80px) rotate(-42deg) scale(0.92);
      opacity: 0.95;
    }

    /* Horizontal Ribbon on Lid */
    .box-ribbon-h {
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 16px;
      transform: translateY(-50%);
      background: linear-gradient(180deg, #FFF59D 0%, #FFD54F 100%);
      opacity: 0.9;
    }

    /* 3D Bow on Top of Lid */
    .bow {
      position: absolute;
      top: -34px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 3.4rem;
      line-height: 1;
      filter: drop-shadow(0 6px 10px rgba(0,0,0,0.25));
      pointer-events: none;
    }

    /* Sparkles & Floating Confetti FX */
    .confetti-fx {
      position: absolute;
      pointer-events: none;
      font-size: 2.6rem;
      animation: confettiPop 1.3s forwards ease-out;
      z-index: 100;
    }
    @keyframes confettiPop {
      0% { opacity: 1; transform: translate(0, 0) scale(0.4) rotate(0deg); }
      50% { opacity: 1; transform: translate(var(--tx), var(--ty)) scale(1.4) rotate(180deg); }
      100% { opacity: 0; transform: translate(var(--tx), calc(var(--ty) + 60px)) scale(0.9) rotate(360deg); }
    }

    /* Idle Visual Ghost Hint Hand */
    .ghost-hand-peek {
      position: absolute;
      font-size: 3.8rem;
      pointer-events: none;
      z-index: 200;
      filter: drop-shadow(0 6px 14px rgba(0,0,0,0.3));
      animation: ghostHandTap 1.5s infinite ease-in-out;
    }
    @keyframes ghostHandTap {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(18px) scale(0.92); }
    }

    /* Bottom Prompt Pill */
    .prompt-footer {
      background: white;
      border: 3.5px solid #0288D1;
      border-radius: 36px;
      padding: 10px 32px;
      font-size: 1.25rem;
      font-weight: 800;
      color: #01579B;
      box-shadow: 0 6px 18px rgba(2, 136, 209, 0.18);
      margin-bottom: 8px;
      z-index: 20;
      letter-spacing: 0.3px;
    }

    /* Responsive Mobile Layouts (Landscape & Portrait) */
    @media (max-width: 768px) and (orientation: portrait) {
      body, html {
        padding: 8px 6px;
      }
      .hud {
        padding: 4px 6px;
        gap: 8px;
      }
      .btn-back {
        padding: 6px 14px;
        font-size: 0.95rem;
        border-width: 2.5px;
      }
      .peek-target-box {
        padding: 4px 12px;
        gap: 6px;
        border-width: 2.5px;
      }
      .target-lbl { font-size: 0.9rem; }
      .target-emoji { font-size: 1.6rem; }
      .target-name { font-size: 1.15rem; }
      .boxes-arena {
        gap: 8px;
        height: auto;
        max-height: 48vh;
        padding-bottom: 8px;
        width: 100%;
      }
      .box-slot {
        width: calc(33.33% - 6px);
        max-width: 110px;
        height: 210px;
      }
      .box-base {
        width: 100%;
        height: 110px;
        border-radius: 20px;
      }
      .box-lid {
        width: calc(100% + 14px);
        left: -7px;
        height: 30px;
      }
      .bow {
        font-size: 2.2rem;
        top: -22px;
      }
      .animal-popup {
        width: 100px;
        height: 100px;
        bottom: 70px;
      }
      .prompt-footer {
        font-size: 0.95rem;
        padding: 6px 16px;
        margin-bottom: 6px;
        border-width: 2.5px;
      }
    }

    @media (orientation: landscape) and (max-height: 520px) {
      body, html {
        padding: 4px 10px;
      }
      .hud {
        padding: 2px 8px;
        margin-bottom: 2px;
      }
      .btn-back {
        padding: 5px 14px;
        font-size: 0.9rem;
        border-width: 2.5px;
      }
      .peek-target-box {
        padding: 3px 14px;
        border-width: 2.5px;
        gap: 6px;
      }
      .target-lbl { font-size: 0.85rem; }
      .target-emoji { font-size: 1.4rem; }
      .target-name { font-size: 1.05rem; }
      .boxes-arena {
        height: calc(100vh - 100px);
        max-height: 240px;
        gap: 16px;
        padding-bottom: 4px;
        margin: 0 auto;
        align-items: flex-end;
      }
      .box-slot {
        width: min(150px, 28vw);
        height: min(210px, 54vh);
      }
      .box-base {
        width: min(130px, 24vw);
        height: min(115px, 30vh);
      }
      .box-lid {
        width: min(150px, 28vw);
        height: 28px;
        left: -10px;
      }
      .bow {
        font-size: 2.2rem;
        top: -22px;
      }
      .animal-popup {
        width: min(110px, 22vw);
        height: min(110px, 22vw);
        bottom: 65px;
      }
      .prompt-footer {
        padding: 4px 18px;
        font-size: 0.9rem;
        margin-bottom: 2px;
        border-width: 2.5px;
      }
    }

    /* MODAL: PEEK-A-BOO CELEBRATION (Chốt qua bài rực rỡ) */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(1, 87, 155, 0.72);
      backdrop-filter: blur(8px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }
    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }
    .celebration-card {
      background: white;
      border-radius: 36px;
      padding: 36px 32px;
      text-align: center;
      max-width: 440px;
      width: 90%;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
      border: 6px solid #4FC3F7;
      animation: popCard 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes popCard {
      from { transform: scale(0.65); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal-trophy-icon {
      font-size: 5rem;
      margin-bottom: 12px;
      animation: floatTrophy 2s infinite ease-in-out;
    }
    @keyframes floatTrophy {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(6deg); }
    }
    .modal-title {
      font-size: 2rem;
      font-weight: 900;
      color: #01579B;
      margin-bottom: 10px;
    }
    .modal-subtitle {
      font-size: 1.15rem;
      color: #546E7A;
      font-weight: 600;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .btn-modal-action {
      background: linear-gradient(135deg, #0288D1 0%, #01579B 100%);
      color: white;
      border: 4px solid #81D4FA;
      border-radius: 50px;
      padding: 15px 36px;
      font-size: 1.35rem;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 10px 28px rgba(2, 136, 209, 0.4);
      transition: transform 0.15s;
    }
    .btn-modal-action:active {
      transform: scale(0.95);
    }

    /* Mobile Responsive Optimizations */
    @media (max-width: 768px) {
      body, html {
        padding: 10px 8px;
        max-width: 100vw;
        overflow-x: hidden;
      }
      .hud {
        gap: 6px;
      }
      .btn-back {
        padding: 8px 14px;
        font-size: 0.95rem;
      }
      .peek-target-box {
        padding: 6px 12px;
        gap: 6px;
      }
      .target-lbl {
        font-size: 0.85rem;
      }
      .target-emoji img {
        width: 26px !important;
        height: 26px !important;
      }
      .target-name {
        font-size: 1.1rem;
      }
      .target-speaker {
        width: 34px;
        height: 34px;
        font-size: 0.95rem;
      }
      .hud > div:last-child {
        display: none;
      }
      .boxes-arena {
        gap: 6px;
        width: 100%;
        max-width: 100%;
        height: auto;
        min-height: 200px;
        padding-bottom: 8px;
        justify-content: space-evenly;
      }
      .box-slot {
        width: 31%;
        max-width: 110px;
        height: 190px;
      }
      .gift-box {
        width: 100%;
        max-width: 105px;
        height: 82px;
      }
      .box-base {
        width: 100%;
        height: 65px;
        border-radius: 14px;
      }
      .box-lid {
        width: 108%;
        left: -4%;
        height: 24px;
        border-radius: 10px;
        top: 6px;
      }
      .box-lid.open {
        transform: translateY(-45px) rotate(-38deg) scale(0.92);
      }
      .box-ribbon-v {
        width: 18px;
      }
      .bow {
        top: -20px;
      }
      .bow img {
        width: 26px !important;
        height: 26px !important;
      }
      .animal-popup {
        bottom: 60px;
        width: 100%;
        height: 110px;
      }
      .animal-popup.revealed {
        transform: translateY(-50px) scale(1);
      }
      .popup-emoji {
        font-size: 3.2rem;
      }
      .popup-label {
        font-size: 0.85rem;
        padding: 4px 10px;
        border-width: 2px;
        margin-top: 4px;
      }
      .prompt-footer {
        font-size: 0.9rem;
        padding: 8px 16px;
        margin-bottom: 4px;
      }
    }

    @media (max-width: 700px) and (orientation: landscape) {
      body, html {
        padding: 4px 8px;
      }
      .hud {
        margin-bottom: 2px;
      }
      .boxes-arena {
        height: 200px;
        padding-bottom: 4px;
      }
      .box-slot {
        width: 110px;
        height: 180px;
      }
      .prompt-footer {
        display: none;
      }
  </style>
</head>
<body>

  <!-- MODAL: CELEBRATION OVERLAY -->
  <div class="modal-overlay" id="modal-celebration">
    <div class="celebration-card">
      <div class="modal-trophy-icon" id="modal-icon"><img src="../assets/icons/crown.png" style="width: 88px; height: 88px; object-fit: contain; filter: drop-shadow(0 10px 20px rgba(255, 193, 7, 0.5));" alt="🎁"></div>
      <h2 class="modal-title" id="modal-title">Bé Thật Tinh Mắt!</h2>
      <p class="modal-subtitle" id="modal-subtitle">Bé đã tìm thấy tất cả bạn nhỏ ú òa trong hộp quà rồi!</p>

      <button type="button" class="btn-modal-action" id="btn-next-peek" onclick="advanceToNextPeekRound()">
        <span>🎉 Mở Hộp Quà Mới Nào ➜</span>
      </button>
    </div>
  </div>

  <!-- Floating Clouds BG -->
  <div class="bg-cloud cloud-1"></div>
  <div class="bg-cloud cloud-2"></div>
  <div class="bg-cloud cloud-3"></div>

  <!-- HUD with Target Badge & Shared Mission Tracker -->
  <div class="hud">
    <a href="../index.html" class="btn-back">⬅ Menu</a>

    <!-- Target Badge: Chạm để nghe nhắc lại -->
    <div class="peek-target-box" id="peek-target-box" title="Chạm để nghe gọi tên">
      <span class="target-lbl">🎯 Tìm:</span>
      <span class="target-emoji" id="target-emoji"><img src="../assets/icons/baby.png" style="width: 36px; height: 36px; object-fit: contain;" alt="👶"></span>
      <span class="target-name" id="target-name">BABY</span>
      <div class="target-speaker">🔊</div>
    </div>

    <!-- Empty placeholder (will be replaced or aligned by MissionEngine) -->
    <div style="width: 80px;"></div>
  </div>

  <!-- 3 Giant Magical Surprise Boxes Arena -->
  <div class="boxes-arena" id="boxes-arena">
    <!-- Box Slot 0 -->
    <div class="box-slot" id="slot-0" data-index="0" onclick="safeClick(0)">
      <div class="animal-popup" id="popup-0">
        <span class="popup-emoji" id="emoji-0">👶</span>
        <div class="popup-label" id="label-0">Baby</div>
      </div>
      <div class="gift-box" id="box-0">
        <div class="box-lid red" id="lid-0">
          <div class="box-ribbon-h"></div>
          <div class="bow"><img src="../assets/icons/ribbon.png" style="width: 44px; height: 44px; object-fit: contain; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.25));" alt="🎀"></div>
        </div>
        <div class="box-base red">
          <div class="box-ribbon-v"></div>
        </div>
      </div>
    </div>

    <!-- Box Slot 1 -->
    <div class="box-slot" id="slot-1" data-index="1" onclick="safeClick(1)">
      <div class="animal-popup" id="popup-1">
        <span class="popup-emoji" id="emoji-1">👩</span>
        <div class="popup-label" id="label-1">Mommy</div>
      </div>
      <div class="gift-box" id="box-1">
        <div class="box-lid orange" id="lid-1">
          <div class="box-ribbon-h"></div>
          <div class="bow"><img src="../assets/icons/ribbon.png" style="width: 44px; height: 44px; object-fit: contain; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.25));" alt="🎀"></div>
        </div>
        <div class="box-base orange">
          <div class="box-ribbon-v"></div>
        </div>
      </div>
    </div>

    <!-- Box Slot 2 -->
    <div class="box-slot" id="slot-2" data-index="2" onclick="safeClick(2)">
      <div class="animal-popup" id="popup-2">
        <span class="popup-emoji" id="emoji-2">👨</span>
        <div class="popup-label" id="label-2">Daddy</div>
      </div>
      <div class="gift-box" id="box-2">
        <div class="box-lid blue" id="lid-2">
          <div class="box-ribbon-h"></div>
          <div class="bow"><img src="../assets/icons/ribbon.png" style="width: 44px; height: 44px; object-fit: contain; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.25));" alt="🎀"></div>
        </div>
        <div class="box-base blue">
          <div class="box-ribbon-v"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Clean Banner Footer -->
  <div class="prompt-footer" id="prompt-footer">🎁 Chạm mở hộp quà!</div>

  <script>
    // -------------------------------------------------------------
    // DYNAMIC 52-WEEK PEEK-A-BOO SYSTEM (Chuẩn tâm lý trẻ 3 tuổi)
    // -------------------------------------------------------------
    const urlParams = new URLSearchParams(window.location.search);
    const queryWeek = parseInt(urlParams.get('week'), 10);
    const currentWeek = (!isNaN(queryWeek) && queryWeek >= 1 && queryWeek <= 52)
      ? queryWeek
      : ((window.MissionEngine && MissionEngine.getCurrentWeek) ? MissionEngine.getCurrentWeek() : 1);
    const weekData = (window.ToddlerVocabulary) ? window.ToddlerVocabulary.build80_20Pack(currentWeek) : null;

    const peekThemes = [
      (weekData && weekData.peekBox && weekData.peekBox.hidingAnimals && weekData.peekBox.hidingAnimals.length >= 3)
        ? weekData.peekBox.hidingAnimals
        : [
            { word: 'Baby', emoji: '👶', sound: 'Cute baby' },
            { word: 'Mommy', emoji: '👩', sound: 'Sweet mommy' },
            { word: 'Daddy', emoji: '👨', sound: 'Strong daddy' }
          ],
      [
        { word: 'Puppy', emoji: '🐶', sound: 'Playful puppy' },
        { word: 'Kitty', emoji: '🐱', sound: 'Fluffy kitty' },
        { word: 'Bunny', emoji: '🐰', sound: 'Hoppy bunny' }
      ],
      [
        { word: 'Apple', emoji: '🍎', sound: 'Yummy red apple' },
        { word: 'Banana', emoji: '🍌', sound: 'Sweet banana' },
        { word: 'Strawberry', emoji: '🍓', sound: 'Juicy strawberry' }
      ],
      [
        { word: 'Car', emoji: '🚗', sound: 'Fast red car' },
        { word: 'Bus', emoji: '🚌', sound: 'Big yellow bus' },
        { word: 'Train', emoji: '🚂', sound: 'Choo choo train' }
      ],
      [
        { word: 'Teddy Bear', emoji: '🧸', sound: 'Soft teddy bear' },
        { word: 'Robot', emoji: '🤖', sound: 'Beep boop robot' },
        { word: 'Ball', emoji: '⚽', sound: 'Bouncing ball' }
      ]
    ];
    let currentThemeIdx = 0;
    let hidingAnimals = peekThemes[0];

    let currentTargetIdx = 0;
    let targetAnimal = hidingAnimals[currentTargetIdx] || hidingAnimals[0];
    let roundFoundCount = 0;

    const targetEmoji = document.getElementById('target-emoji');
    const targetName = document.getElementById('target-name');
    const promptFooter = document.getElementById('prompt-footer');

    let boxContents = [];

    // Luân chuyển sang nhóm bạn nhỏ mới khi chiến thắng
    function advanceToNextPeekRound() {
      const modal = document.getElementById('modal-celebration');
      if (modal) modal.classList.remove('active');

      currentThemeIdx = (currentThemeIdx + 1) % peekThemes.length;
      hidingAnimals = peekThemes[currentThemeIdx];
      currentTargetIdx = 0;
      targetAnimal = hidingAnimals[0];
      roundFoundCount = 0;

      setupBoxes();
      updateTargetHud();
      isBusy = false;
    }

    // Shuffle and assign animals to 3 boxes
    function setupBoxes() {
      // Shuffle hiding items
      const shuffled = [...hidingAnimals].sort(() => Math.random() - 0.5);
      boxContents = shuffled.slice(0, 3);

      // Ensure targetAnimal is definitely inside one of the 3 boxes
      if (!boxContents.some(a => a.word.toLowerCase() === targetAnimal.word.toLowerCase())) {
        const replaceIdx = Math.floor(Math.random() * 3);
        boxContents[replaceIdx] = targetAnimal;
      }

      for (let i = 0; i < 3; i++) {
        const item = boxContents[i];
        const emojiElem = document.getElementById(`emoji-${i}`);
        const labelElem = document.getElementById(`label-${i}`);
        const lidElem = document.getElementById(`lid-${i}`);
        const popupElem = document.getElementById(`popup-${i}`);

        if (emojiElem) {
          emojiElem.innerHTML = (window.ToddlerVocabulary && ToddlerVocabulary.renderWordIcon)
            ? ToddlerVocabulary.renderWordIcon(item, 100)
            : item.emoji;
        }
        if (labelElem) labelElem.innerText = item.word;

        if (lidElem) lidElem.classList.remove('open');
        if (popupElem) {
          popupElem.classList.remove('revealed');
          popupElem.classList.remove('dancing');
        }
      }
    }

    function updateTargetHud() {
      targetEmoji.innerHTML = (window.ToddlerVocabulary && ToddlerVocabulary.renderWordIcon)
        ? ToddlerVocabulary.renderWordIcon(targetAnimal, 42)
        : targetAnimal.emoji;
      targetName.innerText = targetAnimal.word.toUpperCase();
      promptFooter.innerText = `🎁 Tìm ${targetAnimal.word} nào!`;

      // Motherese spoken prompt
      AudioEngine.speak(`Where is ${targetAnimal.word}?`);
      scheduleIdleHint();
    }

    // -------------------------------------------------------------
    // CURIOSITY WOBBLE (Hộp rung rinh kích thích tò mò mỗi 3.2s)
    // -------------------------------------------------------------
    let wobbleInterval = null;
    function startCuriosityWobble() {
      if (wobbleInterval) clearInterval(wobbleInterval);
      wobbleInterval = setInterval(() => {
        if (isBusy) return;
        // Chọn ngẫu nhiên 1 hộp chưa mở để rung rinh nhún nhảy
        const closedBoxes = [];
        for (let i = 0; i < 3; i++) {
          const lid = document.getElementById(`lid-${i}`);
          if (lid && !lid.classList.contains('open')) {
            closedBoxes.push(document.getElementById(`box-${i}`));
          }
        }
        if (closedBoxes.length > 0) {
          const luckyBox = closedBoxes[Math.floor(Math.random() * closedBoxes.length)];
          luckyBox.classList.add('wobble');
          if (window.ToddlerAudio) {
            ToddlerAudio.playTone(600 + Math.random() * 150, 'triangle', 0.12, 0.15);
          }
          setTimeout(() => {
            if (luckyBox) luckyBox.classList.remove('wobble');
          }, 600);
        }
      }, 3200);
    }

    // -------------------------------------------------------------
    // IDLE GHOST HINT HAND (Bàn tay chỉ dẫn sau 3.8s)
    // -------------------------------------------------------------
    let idleTimer = null;
    function scheduleIdleHint() {
      hideGhostHint();
      idleTimer = setTimeout(() => {
        showGhostHint();
      }, 3800);
    }

    function hideGhostHint() {
      if (idleTimer) clearTimeout(idleTimer);
      const ghost = document.getElementById('ghost-hand-peek');
      if (ghost) ghost.style.display = 'none';
    }

    function showGhostHint() {
      if (isBusy) return;
      // Tìm hộp chứa mục tiêu để gõ nhẹ gợi ý
      let targetBoxIdx = boxContents.findIndex(a => a.word.toLowerCase() === targetAnimal.word.toLowerCase());
      if (targetBoxIdx === -1) targetBoxIdx = 0;

      const boxElem = document.getElementById(`box-${targetBoxIdx}`);
      if (!boxElem) return;

      let ghost = document.getElementById('ghost-hand-peek');
      if (!ghost) {
        ghost = document.createElement('div');
        ghost.id = 'ghost-hand-peek';
        ghost.className = 'ghost-hand-peek';
        ghost.innerText = '👆';
        document.body.appendChild(ghost);
      }

      const rect = boxElem.getBoundingClientRect();
      ghost.style.left = (rect.left + rect.width / 2 - 25) + 'px';
      ghost.style.top = (rect.top + 10) + 'px';
      ghost.style.display = 'block';

      AudioEngine.speak(`Tap! Where is ${targetAnimal.word}?`);

      setTimeout(() => {
        if (ghost) ghost.style.display = 'none';
      }, 3500);
    }

    // Confetti Fireworks effect
    function spawnConfetti(centerX, centerY) {
      const chars = ['💖', '⭐', '🍭', '🎉', '✨', '🎈', '🌟'];
      for (let i = 0; i < 14; i++) {
        const fx = document.createElement('div');
        fx.className = 'confetti-fx';
        fx.innerText = chars[i % chars.length];
        const angle = (i / 14) * Math.PI * 2;
        const dist = 90 + Math.random() * 80;
        const tx = Math.cos(angle) * dist;
        const ty = Math.sin(angle) * dist - 40;
        fx.style.setProperty('--tx', `${tx}px`);
        fx.style.setProperty('--ty', `${ty}px`);
        fx.style.left = centerX + 'px';
        fx.style.top = centerY + 'px';
        document.body.appendChild(fx);
        setTimeout(() => fx.remove(), 1300);
      }
    }

    // -------------------------------------------------------------
    // BOX CLICK INTERACTION (Slapstick Pop-up & Gentle Guidance)
    // -------------------------------------------------------------
    let isBusy = false;

    function handleBoxClick(index) {
      if (isBusy) return;
      hideGhostHint();
      AudioEngine.init();

      const boxElem = document.getElementById(`box-${index}`);
      const lidElem = document.getElementById(`lid-${index}`);
      const popupElem = document.getElementById(`popup-${index}`);
      const item = boxContents[index];

      // If already open, do nothing
      if (lidElem.classList.contains('open')) return;

      isBusy = true;
      AudioEngine.playBoing();
      boxElem.classList.add('wobble');
      lidElem.classList.add('open');
      popupElem.classList.add('revealed');

      const isMatch = (item.word.toLowerCase() === targetAnimal.word.toLowerCase());

      setTimeout(() => {
        boxElem.classList.remove('wobble');

        if (isMatch) {
          // -----------------------------------------------------------
          // CASE 1: MATCH! (Bé tìm đúng bạn mục tiêu)
          // -----------------------------------------------------------
          popupElem.classList.add('dancing');
          if (window.ToddlerAudio) ToddlerAudio.playChime();
          AudioEngine.speak(`Peek-a-boo! I see you, ${item.word}! Hooray!`);

          const rect = popupElem.getBoundingClientRect();
          spawnConfetti(rect.left + rect.width / 2, rect.top + rect.height / 2);

          // Cập nhật tiến độ nhiệm vụ Day 3
          if (window.MissionEngine && MissionEngine.recordAction) {
            MissionEngine.recordAction();
          }

          roundFoundCount++;

          if (roundFoundCount >= 3) {
            // Đã tìm đủ 3 bạn trong vòng -> Mở Modal Chiến Thắng Qua Màn!
            setTimeout(() => {
              const modal = document.getElementById('modal-celebration');
              const modalTitle = document.getElementById('modal-title');
              const modalSubtitle = document.getElementById('modal-subtitle');
              const modalIcon = document.getElementById('modal-icon');
              if (modalTitle) modalTitle.innerText = `Bé Thật Tinh Mắt! 🏆`;
              if (modalSubtitle) modalSubtitle.innerText = `Bé đã tìm thấy tất cả ${roundFoundCount} bạn nhỏ ú òa trong hộp quà rồi!`;
              if (modalIcon) modalIcon.innerText = `🎁🌟🎉`;
              if (modal) modal.classList.add('active');
              if (window.ToddlerAudio) ToddlerAudio.playFanfare();
              AudioEngine.speak('Hooray! You found all the friends! Good job!');
            }, 1200);
          } else {
            // Còn bạn nhỏ tiếp theo trong vòng
            setTimeout(() => {
              currentTargetIdx = (currentTargetIdx + 1) % hidingAnimals.length;
              targetAnimal = hidingAnimals[currentTargetIdx];

              setupBoxes();
              updateTargetHud();
              isBusy = false;
            }, 2000);
          }

        } else {
          // -----------------------------------------------------------
          // CASE 2: MISMATCH (Hướng dẫn tích cực, không quở mắng)
          // -----------------------------------------------------------
          AudioEngine.speak(`Hello! Peek-a-boo! I am ${item.word}! Where is ${targetAnimal.word}?`);

          // Để bạn nhỏ xuất hiện chào bé 2 giây rồi nhẹ nhàng thụt xuống
          setTimeout(() => {
            if (window.ToddlerAudio) ToddlerAudio.playThud(220);
            lidElem.classList.remove('open');
            popupElem.classList.remove('revealed');
            popupElem.classList.remove('dancing');
            isBusy = false;
            scheduleIdleHint();
          }, 2000);
        }
      }, 250);
    }

    // Attach listeners to 3 box slots (supports fast pointerdown, click & touch)
    let lastTap = 0;
    function safeClick(i) {
      if (Date.now() - lastTap < 260) return;
      lastTap = Date.now();
      handleBoxClick(i);
    }
    window.safeClick = safeClick;
    window.handleBoxClick = handleBoxClick;

    for (let i = 0; i < 3; i++) {
      const slot = document.getElementById(`slot-${i}`);
      if (slot) {
        slot.addEventListener('pointerdown', () => safeClick(i));
        slot.addEventListener('click', () => safeClick(i));
      }
    }

    // Chạm vào Target Badge trên HUD để nghe lại
    document.getElementById('peek-target-box').addEventListener('pointerdown', (e) => {
      e.stopPropagation();
      hideGhostHint();
      AudioEngine.speak(`Find ${targetAnimal.word}! Where is ${targetAnimal.word}?`);
      scheduleIdleHint();
    });

    // Initialize Day 3 Mission
    if (window.MissionEngine && MissionEngine.initGameMission) {
      MissionEngine.initGameMission('mission_day_3', '.hud');
    }

    // Initialize game
    setupBoxes();
    startCuriosityWobble();

    setTimeout(() => {
      updateTargetHud();
    }, 600);
  </script>
</body>
</html>
