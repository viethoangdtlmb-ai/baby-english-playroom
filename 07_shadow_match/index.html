<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>Magic Shadow Match - Sân Khấu Rối Bóng Kỳ Diệu (Chuẩn 52 Tuần)</title>
  
  <link rel="stylesheet" href="../shared/styles.css">
  <script src="../shared/audio.js"></script>
  <script src="../shared/vocabulary.js"></script>
  <script src="../shared/missions.js"></script>

  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Fredoka', 'Nunito', 'Comic Sans MS', cursive, sans-serif;
      background: radial-gradient(circle at 50% 20%, #FFFDE7 0%, #E8F5E9 48%, #C8E6C9 100%);
      touch-action: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 14px 16px 20px;
      position: relative;
    }

    /* Theater Spotlight Beams */
    .spotlight-beam {
      position: absolute;
      top: 0;
      width: 280px;
      height: 100%;
      pointer-events: none;
      z-index: 1;
      opacity: 0.14;
      background: linear-gradient(180deg, rgba(255, 235, 59, 0.9) 0%, rgba(255, 255, 255, 0) 80%);
      transform-origin: top center;
      filter: blur(16px);
      animation: sweepTheaterLight 7s infinite ease-in-out alternate;
    }
    .beam-left { left: 8%; transform: rotate(-15deg); animation-duration: 8s; }
    .beam-right { right: 8%; transform: rotate(15deg); animation-duration: 6.5s; }
    @keyframes sweepTheaterLight {
      0% { transform: rotate(-14deg); }
      100% { transform: rotate(14deg); }
    }

    /* Top HUD */
    .hud {
      width: 100%;
      max-width: 1050px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 30;
    }
    .btn-back {
      background: #FFF;
      color: #0288D1;
      border: 3.5px solid #29B6F6;
      border-radius: 50px;
      padding: 10px 24px;
      font-size: 1.15rem;
      font-weight: 800;
      text-decoration: none;
      box-shadow: 0 4px 14px rgba(2, 136, 209, 0.22);
      cursor: pointer;
      transition: transform 0.15s;
    }
    .btn-back:active { transform: scale(0.94); }

    /* HUD Level Pill */
    .level-badge-pill {
      background: white;
      border: 3.5px solid #FFA726;
      border-radius: 40px;
      padding: 6px 14px 6px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 6px 18px rgba(255, 167, 38, 0.25);
      font-size: 1.18rem;
      font-weight: 800;
      color: #E65100;
      cursor: pointer;
    }
    .btn-next-stage {
      background: linear-gradient(135deg, #FFA726 0%, #FB8C00 100%);
      color: #FFF;
      border: none;
      border-radius: 24px;
      padding: 6px 13px;
      font-size: 0.92rem;
      font-weight: 800;
      font-family: inherit;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      box-shadow: 0 3px 8px rgba(251, 140, 0, 0.3);
      transition: transform 0.15s;
    }
    .btn-next-stage:active {
      transform: scale(0.93);
    }

    /* Star Score Badge */
    .star-hud-badge {
      background: white;
      border: 3.5px solid #FFD54F;
      border-radius: 30px;
      padding: 8px 20px;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 14px rgba(255, 213, 79, 0.35);
      font-weight: 800;
      font-size: 1.2rem;
      color: #F57F17;
    }

    /* Theater Stage Area */
    .theater-stage {
      width: 100%;
      max-width: 1050px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      align-items: center;
      z-index: 10;
      position: relative;
    }

    /* Target Row: 3 Big Shadow Frames */
    .target-shadow-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 36px;
      width: 100%;
      z-index: 15;
    }

    .shadow-slot {
      width: 180px;
      height: 180px;
      border-radius: 36px;
      background: rgba(255, 255, 255, 0.78);
      border: 4px dashed #81C784;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      box-shadow: 0 10px 24px rgba(46, 125, 50, 0.12), inset 0 2px 6px rgba(0,0,0,0.06);
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), border-color 0.2s, box-shadow 0.2s;
      cursor: pointer;
    }

    /* Calling Glow when Card is selected or dragged nearby */
    .shadow-slot.target-calling {
      border: 4px solid #FFA726 !important;
      background: #FFF8E1 !important;
      transform: scale(1.08) translateY(-6px);
      box-shadow: 0 0 28px rgba(255, 167, 38, 0.65), 0 12px 28px rgba(0,0,0,0.15) !important;
    }

    /* Golden star indicator pointing to the shadow */
    .slot-star-hint {
      position: absolute;
      top: -46px;
      font-size: 2.6rem;
      pointer-events: none;
      display: none;
      animation: starHintHop 0.7s infinite alternate ease-in-out;
      filter: drop-shadow(0 4px 8px rgba(255, 167, 38, 0.5));
      z-index: 30;
    }
    .shadow-slot.target-calling .slot-star-hint {
      display: block;
    }
    @keyframes starHintHop {
      0% { transform: translateY(0) scale(1); }
      100% { transform: translateY(-12px) scale(1.2); }
    }

    /* Sharp Distinctive Silhouette */
    .shadow-silhouette {
      font-size: 5.6rem;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      filter: brightness(0) contrast(200%) opacity(0.42) drop-shadow(0 4px 6px rgba(0,0,0,0.25));
      pointer-events: none;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.3s;
    }

    /* Solfege / English Label below silhouette */
    .slot-shadow-label {
      font-size: 1.15rem;
      font-weight: 800;
      color: rgba(55, 71, 79, 0.48);
      margin-top: 6px;
      pointer-events: none;
      letter-spacing: 0.5px;
      text-align: center;
      max-width: 94%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Matched Awakened State */
    .shadow-slot.matched {
      background: white !important;
      border: 4px solid #4CAF50 !important;
      box-shadow: 0 12px 30px rgba(76, 175, 80, 0.35) !important;
      transform: scale(1.05);
    }
    .shadow-slot.matched .shadow-silhouette {
      filter: drop-shadow(0 8px 16px rgba(0,0,0,0.22)) !important;
      animation: awakeningPop 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }
    .shadow-slot.matched .slot-shadow-label {
      color: #2E7D32 !important;
      font-weight: 900;
    }

    @keyframes awakeningPop {
      0% { transform: scale(0.4) rotate(-15deg); filter: brightness(0) opacity(0.3); }
      60% { transform: scale(1.28) rotate(8deg); filter: none; }
      80% { transform: scale(0.95) rotate(-4deg); filter: none; }
      100% { transform: scale(1.08) rotate(0deg); filter: drop-shadow(0 8px 16px rgba(0,0,0,0.22)); }
    }

    /* Source Row: 3 Draggable Living Puppet Cards with Zero-Shift Slots */
    .source-cards-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 36px;
      width: 100%;
      z-index: 20;
    }

    .source-card-slot {
      width: 160px;
      height: 168px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      flex-shrink: 0;
    }

    .drag-card {
      width: 160px;
      height: 168px;
      background: white;
      border: 4px solid #FFD54F;
      border-radius: 32px;
      box-shadow: 0 10px 0 #FFB300, 0 14px 26px rgba(0,0,0,0.14);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 16px 8px 12px;
      cursor: grab;
      touch-action: none;
      transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1), border-color 0.15s, box-shadow 0.15s;
      position: relative;
    }
    .drag-card:active {
      cursor: grabbing;
    }

    .drag-card.selected-tap {
      border-color: #FF5722 !important;
      transform: translateY(-12px) scale(1.08) !important;
      box-shadow: 0 12px 0 #E64A19, 0 18px 32px rgba(255, 87, 34, 0.35) !important;
      animation: gentleWiggle 0.6s infinite alternate ease-in-out;
    }
    @keyframes gentleWiggle {
      0% { transform: translateY(-12px) scale(1.08) rotate(-3deg); }
      100% { transform: translateY(-12px) scale(1.08) rotate(3deg); }
    }

    .drag-emoji {
      font-size: 5rem;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      filter: drop-shadow(0 6px 12px rgba(0,0,0,0.16));
      transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .drag-card:active .drag-emoji, .drag-card.dragging .drag-emoji {
      transform: scale(1.18);
    }

    .drag-label {
      font-size: 1.25rem;
      font-weight: 900;
      color: #37474F;
      pointer-events: none;
      letter-spacing: 0.4px;
      text-align: center;
      max-width: 96%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Matched Disappear Animation */
    .drag-card.card-matched-away {
      animation: cardFlyInSlot 0.4s forwards ease-in;
      pointer-events: none;
    }
    @keyframes cardFlyInSlot {
      0% { transform: scale(1); opacity: 1; }
      100% { transform: scale(0.2) translateY(-120px); opacity: 0; }
    }

    /* Floating Sparkles & Star Particles */
    .star-pop-fx {
      position: absolute;
      font-size: 3rem;
      pointer-events: none;
      z-index: 100;
      animation: starBurstPop 1.2s forwards ease-out;
    }
    @keyframes starBurstPop {
      0% { opacity: 1; transform: translate(0, 0) scale(0.3) rotate(0deg); }
      50% { opacity: 1; transform: translate(var(--tx), var(--ty)) scale(1.35) rotate(180deg); }
      100% { opacity: 0; transform: translate(var(--tx), calc(var(--ty) + 50px)) scale(0.8) rotate(360deg); }
    }

    /* Victory All Matched Dance */
    .shadow-slot.all-win-dance {
      animation: slotHappyDance 0.8s infinite alternate ease-in-out !important;
    }
    @keyframes slotHappyDance {
      0% { transform: scale(1.05) translateY(0) rotate(-4deg); }
      100% { transform: scale(1.12) translateY(-16px) rotate(4deg); }
    }

    /* Bottom Prompt Pill */
    .prompt-footer-pill {
      background: white;
      border: 3.5px solid #FFA726;
      border-radius: 36px;
      padding: 10px 32px;
      font-size: 1.3rem;
      font-weight: 800;
      color: #E65100;
      box-shadow: 0 6px 18px rgba(255, 167, 38, 0.22);
      z-index: 25;
      text-align: center;
      letter-spacing: 0.3px;
    }

    /* Theater Superstar Celebration Modal */
    .victory-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(38, 50, 56, 0.68);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 220;
      padding: 16px;
    }
    .victory-modal-overlay.active {
      display: flex;
    }
    .victory-card {
      background: #FFFFFF;
      border: 5px solid #FFD54F;
      border-radius: 36px;
      padding: 24px 22px;
      max-width: 460px;
      width: 100%;
      text-align: center;
      box-shadow: 0 18px 42px rgba(0, 0, 0, 0.28);
      animation: victoryPopIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes victoryPopIn {
      0% { transform: scale(0.75); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .victory-icon {
      margin-bottom: 8px;
      display: flex;
      justify-content: center;
      gap: 8px;
      align-items: center;
    }
    .victory-title {
      font-size: 1.7rem;
      font-weight: 900;
      color: #2E7D32;
      margin-bottom: 6px;
    }
    .victory-sub {
      font-size: 1.05rem;
      font-weight: 700;
      color: #5D4037;
      margin-bottom: 14px;
    }
    .parent-tip-box {
      background: #FFF8E1;
      border: 2.5px dashed #FFB300;
      border-radius: 22px;
      padding: 12px 14px;
      text-align: left;
      margin-bottom: 16px;
      font-size: 0.94rem;
      color: #4E342E;
      line-height: 1.45;
    }
    .parent-tip-title {
      font-weight: 900;
      color: #E65100;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .victory-actions {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn-victory-action {
      border: none;
      border-radius: 30px;
      padding: 12px 24px;
      font-size: 1.1rem;
      font-weight: 900;
      cursor: pointer;
      font-family: inherit;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: transform 0.15s;
    }
    .btn-victory-action:active {
      transform: scale(0.94);
    }
    .btn-play-again {
      background: linear-gradient(135deg, #66BB6A 0%, #2E7D32 100%);
      color: #FFFFFF;
      box-shadow: 0 6px 16px rgba(46, 125, 50, 0.35);
    }
    .btn-home-menu {
      background: #E1F5FE;
      color: #0277BD;
      border: 2.5px solid #4FC3F7;
    }

    /* Spotlight Wrap Container & Mobile Rules */
    .spotlight-wrap {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      pointer-events: none;
      z-index: 1;
    }

    @media (max-width: 768px) {
      body, html {
        padding: 6px 6px 10px;
        max-width: 100vw;
        overflow-x: hidden;
      }
      .hud {
        width: 100%;
        max-width: 100%;
        flex-wrap: wrap;
        gap: 4px;
        justify-content: space-between;
      }
      .btn-back {
        padding: 5px 12px;
        font-size: 0.85rem;
      }
      .star-hud-badge {
        padding: 5px 10px;
        font-size: 0.85rem;
        border-width: 2px;
        gap: 4px;
      }
      .level-badge-pill {
        order: 3;
        width: 100%;
        justify-content: space-between;
        padding: 4px 8px 4px 12px;
        font-size: 0.82rem;
        border-width: 2px;
        gap: 6px;
      }
      .btn-next-stage {
        padding: 4px 10px;
        font-size: 0.76rem;
      }
      .theater-stage {
        width: 100%;
        max-width: 100%;
        gap: 8px;
      }
      .target-shadow-row {
        gap: 6px;
        width: 100%;
      }
      .shadow-slot {
        width: 31%;
        max-width: 108px;
        height: 112px;
        border-radius: 18px;
        border-width: 2.5px;
      }
      .slot-star-hint {
        top: -32px;
        font-size: 1.7rem;
      }
      .shadow-silhouette {
        font-size: 3rem;
      }
      .shadow-silhouette img.toddler-3d-word-icon {
        width: 58px !important;
        height: 58px !important;
      }
      .slot-shadow-label {
        font-size: 0.74rem;
        margin-top: 3px;
      }
      .source-cards-row {
        gap: 6px;
        width: 100%;
      }
      .source-card-slot {
        width: 31%;
        max-width: 108px;
        height: 114px;
      }
      .drag-card {
        width: 100%;
        height: 100%;
        border-radius: 18px;
        border-width: 2.5px;
        padding: 8px 4px 6px;
        box-shadow: 0 4px 0 #FFB300, 0 6px 12px rgba(0,0,0,0.12);
      }
      .drag-emoji {
        font-size: 2.5rem;
      }
      .drag-emoji img.toddler-3d-word-icon {
        width: 56px !important;
        height: 56px !important;
      }
      .drag-label {
        font-size: 0.74rem;
      }
      .prompt-footer-pill {
        font-size: 0.8rem;
        padding: 5px 12px;
        margin-top: 2px;
      }
    }

    @media (orientation: landscape) and (max-height: 520px) {
      body, html {
        padding: 2px 8px;
      }
      .hud {
        padding: 2px 8px;
        max-width: 100%;
      }
      .btn-back {
        padding: 4px 12px;
        font-size: 0.85rem;
      }
      .level-badge-pill {
        padding: 3px 10px;
        font-size: 0.82rem;
      }
      .btn-next-stage {
        padding: 3px 8px;
        font-size: 0.75rem;
      }
      .star-hud-badge {
        padding: 3px 10px;
        font-size: 0.85rem;
      }
      .theater-stage {
        gap: 6px;
        padding: 0;
        justify-content: space-around;
      }
      .target-shadow-row, .source-cards-row {
        gap: 12px;
      }
      .shadow-slot {
        width: min(130px, 24vw);
        height: min(98px, 28vh);
        border-radius: 18px;
      }
      .shadow-silhouette {
        font-size: min(2.6rem, 15vh);
      }
      .shadow-silhouette img.toddler-3d-word-icon {
        width: 46px !important;
        height: 46px !important;
      }
      .slot-shadow-label {
        font-size: 0.72rem;
        margin-top: 2px;
      }
      .source-card-slot {
        width: min(130px, 24vw);
        height: min(98px, 28vh);
      }
      .drag-card {
        width: 100%;
        height: 100%;
        border-radius: 18px;
        padding: 6px 4px 4px;
        box-shadow: 0 4px 0 #FFB300, 0 6px 12px rgba(0,0,0,0.12);
      }
      .drag-emoji {
        font-size: min(2.6rem, 15vh);
      }
      .drag-emoji img.toddler-3d-word-icon {
        width: 46px !important;
        height: 46px !important;
      }
      .drag-label {
        font-size: 0.74rem;
      }
      .prompt-footer-pill {
        display: none;
      }
    }
  </style>
</head>
<body>

  <!-- Theater Spotlights contained in spotlight-wrap -->
  <div class="spotlight-wrap">
    <div class="spotlight-beam beam-left"></div>
    <div class="spotlight-beam beam-right"></div>
  </div>

  <!-- HUD -->
  <div class="hud">
    <a href="../index.html" class="btn-back">⬅ Menu</a>

    <!-- Level Pill -->
    <div class="level-badge-pill" id="level-badge-pill" onclick="announceNextUnmatchedShadow()" title="Chạm để nghe câu đố">
      <span>🎭 <span id="level-title-text">Màn 1: Các Bạn Thú</span></span>
      <button type="button" class="btn-next-stage" onclick="event.stopPropagation(); skipToNextLevel();" title="Chuyển sang màn tiếp theo">
        <span>⏭️ Đổi Màn</span>
      </button>
    </div>

    <!-- Star Count Badge -->
    <div class="star-hud-badge">
      <span>⭐</span>
      <span id="star-score-text">0 Stars</span>
    </div>
  </div>

  <!-- Theater Stage Container -->
  <div class="theater-stage" id="theater-stage">
    <!-- Top Row: 3 Target Shadows -->
    <div class="target-shadow-row" id="target-shadow-row"></div>

    <!-- Bottom Row: 3 Draggable Cards -->
    <div class="source-cards-row" id="source-cards-row"></div>
  </div>

  <!-- Bottom Guidance Pill -->
  <div class="prompt-footer-pill" id="prompt-footer-pill">
    🎭 Ghép bạn nhỏ vào bóng!
  </div>

  <!-- Theater Superstar Celebration Modal -->
  <div class="victory-modal-overlay" id="victory-modal">
    <div class="victory-card">
      <div class="victory-icon" id="victory-icon">🌟</div>
      <div class="victory-title"> Bậc Thầy Rối Bóng! 🎭</div>
      <div class="victory-sub" id="victory-sub">Bé đã tinh mắt ghép đúng tất cả các bóng hình!</div>
      <div class="parent-tip-box">
        <div class="parent-tip-title">💡 Góc Đồng Hành Cùng Mẹ:</div>
        <div id="parent-tip-text">Mẹ hãy cùng bé bật đèn pin chiếu bóng tay lên tường và gọi tên các đồ vật quanh phòng nhé!</div>
      </div>
      <div class="victory-actions">
        <button type="button" class="btn-victory-action btn-play-again" onclick="closeVictoryModal()">
          <span>🎭 Chơi Tiếp</span>
        </button>
        <a href="../index.html" class="btn-victory-action btn-home-menu">
          <span>🏠 Về Menu</span>
        </a>
      </div>
    </div>
  </div>

  <script>
    // -------------------------------------------------------------
    // MAGIC SHADOW MATCH ENGINE (100% Natural Touch for 3yo)
    // -------------------------------------------------------------
    const AudioEngine = window.AudioEngine || window.ToddlerAudio || {};

    const urlParams = new URLSearchParams(window.location.search);
    const queryWeek = parseInt(urlParams.get('week'), 10);
    const currentWeek = queryWeek || ((window.MissionEngine && MissionEngine.getCurrentWeek) ? MissionEngine.getCurrentWeek() : 1);
    const weekData = (window.ToddlerVocabulary) ? window.ToddlerVocabulary.build80_20Pack(currentWeek) : null;

    const fallbackShadowPool = [
      { id: 'elephant', name: 'Elephant', emoji: '🐘', sound: 'Pawoo pawoo' },
      { id: 'giraffe', name: 'Giraffe', emoji: '🦒', sound: 'Tall giraffe' },
      { id: 'rabbit', name: 'Rabbit', emoji: '🐰', sound: 'Hop hop hop' }
    ];

    function normalizeShadowItems(rawList, fallbackList) {
      const seen = new Set();
      const result = [];
      const candidates = [...(rawList || []), ...(fallbackList || []), ...fallbackShadowPool];
      for (const item of candidates) {
        if (!item) continue;
        const wordStr = item.word || item.name;
        if (!wordStr) continue;
        const idStr = (item.id || wordStr).toLowerCase().trim().replace(/\s+/g, '_');

          result.push({
            id: idStr,
            name: wordStr,
            emoji: item.emoji || '⭐',
            sound: item.sound || `Look at the ${wordStr.toLowerCase()}`
          });
        }
        if (result.length >= 3) break;
      }
      return result;

    // -------------------------------------------------------------
    // TẢI CẤP ĐỘ MỚI (LOAD LEVEL)
    // -------------------------------------------------------------
    function loadLevel(lvlIdx, isInitialLoad = false) {
      clearPendingTimers();
      matchCount = 0;
      selectedCard = null;
      isTransitioning = false;
      targetRow.innerHTML = '';
      sourceRow.innerHTML = '';

      const lvl = levels[lvlIdx % levels.length];
      levelTitle.innerText = lvl.title;
      promptPill.innerText = '🎭 Ghép bạn nhỏ vào bóng!';

      // Shuffle danh sách hiển thị thẻ bài
      const shuffledItems = [...lvl.items].sort(() => Math.random() - 0.5);

      // 1. Tạo 3 khung bóng đen (Target Shadows)
      lvl.items.forEach(item => {
        const slot = document.createElement('div');
        slot.className = 'shadow-slot';
        slot.id = 'slot-' + item.id;
        slot.dataset.id = item.id;
        slot.dataset.name = item.name;
        slot.dataset.sound = item.sound;

        const iconHtml = render3dIconOrEmoji(item, 88, item.emoji);

        slot.innerHTML = `
          <div class="slot-star-hint">⭐👆</div>
          <span class="shadow-silhouette" id="sil-${item.id}">${iconHtml}</span>
          <span class="slot-shadow-label">${item.name}</span>
        `;

        // Chạm vào bóng khi đã chọn thẻ bài (Tap & Snap) hoặc khi đã thức giấc
        function handleSlotAction() {
          if (isTransitioning) return;

          // Nếu bóng đã được đánh thức: Chạm để nghe lại câu ngữ cảnh vui nhộn
          if (slot.classList.contains('matched')) {
            slot.style.transform = 'scale(1.14)';
            setTimeout(() => slot.style.transform = '', 240);
            if (AudioEngine.playPop) AudioEngine.playPop();
            const phrase = (window.ToddlerVocabulary && ToddlerVocabulary.getWordContextPhrase)
              ? ToddlerVocabulary.getWordContextPhrase(item)
              : `${item.name}! ${item.sound}!`;
            AudioEngine.speak(phrase);
            return;
          }

          if (selectedCard) {
            if (selectedCard.dataset.id === slot.dataset.id) {
              performSuccessMatch(selectedCard, slot);
            } else {
              // Bấm nhầm bóng khác: Rung nhẹ báo hiệu
              wiggleWrongSlot(slot, selectedCard.dataset.name);
            }
          } else {
            // Chạm bóng khi chưa chọn thẻ: Gợi ý tìm bạn
            AudioEngine.speak(`Where is ${item.name}? Tap ${item.name}!`);
            highlightMatchingCard(item.id);
          }
        }

        slot.addEventListener('pointerdown', (e) => {
          e.stopPropagation();
          handleSlotAction();
        });

        targetRow.appendChild(slot);
      });

      // 2. Tạo 3 thẻ bài bạn nhỏ bọc trong .source-card-slot (Chống nhảy bố cục 100%)

        const cardSlot = document.createElement('div');

          if (isTransitioning) return;
          if (activeDrag && activeDrag.hasMoved) return;

          if (AudioEngine.init) AudioEngine.init();
          AudioEngine.speak(`${item.name}!`);

          // Bỏ chọn thẻ cũ

          selectedCard = card;
          card.classList.add('selected-tap');

          // Làm bóng tương ứng sáng bừng vẫy gọi
          const matchingSlot = document.getElementById('slot-' + item.id);
          if (matchingSlot && !matchingSlot.classList.contains('matched')) {

            promptPill.innerText = `⭐ Chạm vào bóng đen của ${item.name} nào!`;

        cardSlot.appendChild(card);
        sourceRow.appendChild(cardSlot);

      promptTimer = setTimeout(() => {

    function skipToNextLevel() {
      if (isTransitioning) return;

    function wiggleWrongSlot(slot, expectedCardName) {
      slot.style.transform = 'translateX(-8px)';
      setTimeout(() => slot.style.transform = 'translateX(8px)', 80);
      setTimeout(() => slot.style.transform = '', 160);

      promptPill.innerText = `🔍 Đó là bóng của ${slot.dataset.name}! Hãy tìm bóng của ${expectedCardName} nhé!`;
      AudioEngine.speak(`No, find ${expectedCardName}'s shadow!`);

    function announceNextUnmatchedShadow(withWelcomePrefix = false) {
      if (isTransitioning) return;
      const unmatchedSlot = document.querySelector('.shadow-slot:not(.matched)');
      if (!unmatchedSlot) return;
      document.querySelectorAll('.shadow-slot').forEach(s => s.classList.remove('target-calling'));
      unmatchedSlot.classList.add('target-calling');
      const targetName = unmatchedSlot.dataset.name;
      promptPill.innerText = `🔍 Đố bé bóng đen của ${targetName} ở đâu nhỉ?`;
      const prefix = withWelcomePrefix ? 'Shadow Match! ' : '';
      AudioEngine.speak(`${prefix}Where is ${targetName}? Find ${targetName}'s shadow!`);
    }

    function highlightMatchingCard(itemId) {
      const card = document.getElementById('card-' + itemId);
      if (card) {

    // -------------------------------------------------------------
    // KHỚP ĐÚNG BÓNG ĐEN (PERFORM SUCCESS MATCH & AWAKENING)
    // -------------------------------------------------------------
    function performSuccessMatch(card, targetSlot) {
      if (targetSlot.classList.contains('matched')) return;
      clearPendingTimers();

      document.querySelectorAll('.shadow-slot').forEach(s => s.classList.remove('target-calling'));
      document.querySelectorAll('.drag-card').forEach(c => c.classList.remove('selected-tap'));

      targetSlot.classList.add('matched');

      // Âm thanh chuông ngân & Giọng đọc câu ngữ cảnh đầy đủ theo đúng ID từ vựng
      if (AudioEngine.playChime) AudioEngine.playChime();
      const lookupKey = targetSlot.dataset.id || targetSlot.dataset.name;
      const contextPhrase = (window.ToddlerVocabulary && ToddlerVocabulary.getWordContextPhrase)
        ? ToddlerVocabulary.getWordContextPhrase(lookupKey)
        : `${targetSlot.dataset.name}! ${targetSlot.dataset.sound}!`;
      AudioEngine.speak(`Yes! ${contextPhrase}`);

      // Hiệu ứng pháo hoa sao nhỏ
      const rect = targetSlot.getBoundingClientRect();
      spawnSparkles(rect.left + rect.width / 2, rect.top + rect.height / 2);

      // Thẻ bài biến mất mượt mà bên trong .source-card-slot (Giữ nguyên vị trí các thẻ còn lại)
      card.style.position = 'relative';
      card.style.left = '0px';
      card.style.top = '0px';
      card.classList.add('card-matched-away');
      setTimeout(() => card.remove(), 420);

      selectedCard = null;
      matchCount++;

      // Ghi nhận tiến độ nhiệm vụ
      if (window.MissionEngine && MissionEngine.recordAction) {
        MissionEngine.recordAction();
      }

      promptPill.innerText = `✨ Tuyệt vời! Bé đã tìm đúng ${targetSlot.dataset.name}!`;

      // Nếu đã ghép đủ 3 bạn nhỏ: Chờ 1900ms để bé nghe trọn vẹn câu ngữ cảnh của từ thứ 3
      if (matchCount >= 3) {
        onLevelCompleted();
      } else {
        promptTimer = setTimeout(() => {
          announceNextUnmatchedShadow(false);
        }, 1950);
      }
    }

    // Ăn mừng hoàn thành cấp độ & Tự động sang màn mới
    function onLevelCompleted() {
      isTransitioning = true;
      completedLevelsCount++;
      earnedStars += 3;
      starScoreText.innerText = `${earnedStars} Stars`;

      promptPill.innerText = '🎉 Hoan hô! Bé đã ghép đúng tất cả các bạn nhỏ! 🌟';

            showVictoryModal();

    function showVictoryModal() {
      const modal = document.getElementById('victory-modal');

      const tipTextElem = document.getElementById('parent-tip-text');
      const curItems = levels[currentLevel % levels.length].items;

      if (vIcon) {
        vIcon.innerHTML =
          render3dIconOrEmoji({ id: 'crown', word: 'Crown', emoji: '👑' }, 58, '👑') +

        tipTextElem.innerText = `${tipInfo.tipText} (Từ vựng tuần ${currentWeek}: ${tipInfo.wordListStr})`;

        modal.classList.add('active');

    function closeVictoryModal() {

      loadLevel(currentLevel, false);

    // -------------------------------------------------------------
    // KÉO THẢ NAM CHÂM SIÊU NHẠY (MAGNETIC SNAP DRAG)
    // -------------------------------------------------------------
    let activeDrag = null;

    function attachMagneticDrag(card) {
      card.addEventListener('pointerdown', (e) => {
        if (isTransitioning) return;
        if (AudioEngine.init) AudioEngine.init();

        const rect = card.getBoundingClientRect();
        activeDrag = {
          elem: card,
          startX: e.clientX,
          startY: e.clientY,
          offsetX: e.clientX - rect.left,
          offsetY: e.clientY - rect.top,
          hasMoved: false
        };

        card.setPointerCapture(e.pointerId);
      });

      card.addEventListener('pointermove', (e) => {
        if (!activeDrag || activeDrag.elem !== card) return;

        const dx = Math.abs(e.clientX - activeDrag.startX);
        const dy = Math.abs(e.clientY - activeDrag.startY);

        if (dx > 8 || dy > 8) {
          activeDrag.hasMoved = true;
          card.classList.add('dragging');
          card.style.position = 'fixed';
          card.style.width = `${card.parentElement ? card.parentElement.offsetWidth : 150}px`;
          card.style.height = `${card.parentElement ? card.parentElement.offsetHeight : 156}px`;
          card.style.zIndex = '100';
          card.style.transform = 'scale(1.18)';
          card.style.left = `${e.clientX - activeDrag.offsetX}px`;
          card.style.top = `${e.clientY - activeDrag.offsetY}px`;

          // Kiểm tra vị trí gần bóng tương ứng (Lực hút nam châm)
          checkMagneticHover(card, e.clientX, e.clientY);
        }
      });

      card.addEventListener('pointerup', (e) => {
        if (!activeDrag || activeDrag.elem !== card) return;

        if (activeDrag.hasMoved) {
          card.classList.remove('dragging');
          resolveDragDrop(card, e.clientX, e.clientY);
        }

        activeDrag = null;
      });

      card.addEventListener('pointercancel', () => {
        if (activeDrag && activeDrag.elem === card) {
          resetCardPosition(card);
          activeDrag = null;
        }
      });
    }

    function checkMagneticHover(card, cx, cy) {
      const targetSlot = document.getElementById('slot-' + card.dataset.id);
      if (!targetSlot || targetSlot.classList.contains('matched')) return;

      const sRect = targetSlot.getBoundingClientRect();
      const sx = sRect.left + sRect.width / 2;
      const sy = sRect.top + sRect.height / 2;
      const dist = Math.hypot(cx - sx, cy - sy);

      // Nếu trong phạm vi 150px: Kích hoạt lực hút nam châm
      if (dist < 150) {
        targetSlot.classList.add('target-calling');
      } else {
        targetSlot.classList.remove('target-calling');
      }
    }

    function resolveDragDrop(card, cx, cy) {
      const targetSlot = document.getElementById('slot-' + card.dataset.id);

      if (targetSlot && !targetSlot.classList.contains('matched')) {
        const sRect = targetSlot.getBoundingClientRect();
        const sx = sRect.left + sRect.width / 2;
        const sy = sRect.top + sRect.height / 2;
        const dist = Math.hypot(cx - sx, cy - sy);

        // Khớp thành công trong bán kính nam châm rộng 150px
        if (dist < 150) {
          performSuccessMatch(card, targetSlot);
          return;
        }
      }

      // Kiểm tra nếu bé thả nhầm vào một khung bóng khác chưa ghép để nhắc nhẹ nhàng
      const allUnmatchedSlots = document.querySelectorAll('.shadow-slot:not(.matched)');
      for (const otherSlot of allUnmatchedSlots) {
        if (otherSlot.dataset.id === card.dataset.id) continue;
        const oRect = otherSlot.getBoundingClientRect();
        const ox = oRect.left + oRect.width / 2;
        const oy = oRect.top + oRect.height / 2;
        if (Math.hypot(cx - ox, cy - oy) < 125) {
          wiggleWrongSlot(otherSlot, card.dataset.name);
          resetCardPosition(card);
          if (targetSlot && !targetSlot.classList.contains('matched')) {
            targetSlot.classList.add('target-calling');
          }
          return;
        }
      }

      // Không khớp: Thẻ nảy đàn hồi về vị trí cũ
      resetCardPosition(card);
    }

    function resetCardPosition(card) {
      card.style.position = 'relative';
      card.style.width = '100%';
      card.style.height = '100%';
      card.style.left = '0px';
      card.style.top = '0px';
      card.style.zIndex = '1';
      card.style.transform = '';
      document.querySelectorAll('.shadow-slot').forEach(s => s.classList.remove('target-calling'));
    }

    // -------------------------------------------------------------
    // HIỆU ỨNG THỊ GIÁC PHÁO HOA & NGÔI SAO
    // -------------------------------------------------------------
    function spawnSparkles(cx, cy) {
      const items = ['⭐', '✨', '💖', '🍭', '🎉'];
      for (let i = 0; i < 14; i++) {
        const fx = document.createElement('div');
        fx.className = 'star-pop-fx';
        fx.innerText = items[i % items.length];
        const angle = (i / 14) * Math.PI * 2;
        const dist = 70 + Math.random() * 80;
        const tx = Math.cos(angle) * dist;
        const ty = Math.sin(angle) * dist - 25;

        fx.style.setProperty('--tx', `${tx}px`);
        fx.style.setProperty('--ty', `${ty}px`);
        fx.style.left = `${cx}px`;
        fx.style.top = `${cy}px`;

        document.body.appendChild(fx);
        setTimeout(() => fx.remove(), 1100);
      }
    }

    function spawnGrandCelebration() {
      const items = ['⭐', '✨', '💖', '🎉', '🌟', '🍭', '🎨'];
      for (let i = 0; i < 24; i++) {
        const fx = document.createElement('div');
        fx.className = 'star-pop-fx';
        fx.innerText = items[i % items.length];
        const angle = (i / 24) * Math.PI * 2;
        const dist = 120 + Math.random() * 150;
        const tx = Math.cos(angle) * dist;
        const ty = Math.sin(angle) * dist - 30;

        fx.style.setProperty('--tx', `${tx}px`);
        fx.style.setProperty('--ty', `${ty}px`);
        fx.style.left = '50%';
        fx.style.top = '40%';

        document.body.appendChild(fx);
        setTimeout(() => fx.remove(), 1200);
      }
    }

    // Expose helpers globally
    window.loadLevel = loadLevel;
    window.skipToNextLevel = skipToNextLevel;
    window.announceNextUnmatchedShadow = announceNextUnmatchedShadow;
    window.performSuccessMatch = performSuccessMatch;
    window.closeVictoryModal = closeVictoryModal;

    // Initialize Day 5 Mission (Roadmap integration & Sticker Unlock)
    if (window.MissionEngine && MissionEngine.initGameMission) {
      MissionEngine.initGameMission('mission_day_5', '.hud');
    }

    // Khởi tạo Màn 1
    loadLevel(0, true);

    window.addEventListener('pointerdown', () => {
      if (window.AudioEngine) {
        AudioEngine.init();
        AudioEngine.startBGM('action');
      }
    }, { once: true });
  </script>
</body>
</html>
